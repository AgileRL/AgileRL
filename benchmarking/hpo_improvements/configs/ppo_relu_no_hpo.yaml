---
# PPO with NO HPO (single agent, never mutated).
#
# Hyperparameters from "ReLU to the Rescue: Improve Your On-Policy Actor-Critic
# with Positive Advantages" (Jesson et al., 2024), Table 3, Appendix D.1 -- the
# PPO column for Gymnasium MuJoCo (CleanRL implementation).
#
# Mapping notes (paper -> AgileRL):
#   num. envs = 1, num. steps = 2048  -> learn_step = 2048 (1 env x 2048 steps)
#   num. minibatch = 32 over a 2048-step rollout -> batch_size = 2048/32 = 64
#   width 64 / tanh / 2 hidden layers -> latent_dim 64, encoder [64], head [64]
#   norm. adv. / norm. obs. / norm. reward / orthogonal init / lr annealing are
#     handled internally by AgileRL's PPO and are not separate YAML knobs.
#   The environment `name` here is a placeholder; the benchmark script overrides
#   it per selected environment.

algorithm:
    name: PPO
    batch_size: 1024
    lr: 0.0003
    learn_step: 32768
    gamma: 0.99
    gae_lambda: 0.95
    action_std_init: 0.0
    clip_coef: 0.2
    ent_coef: 0.0
    vf_coef: 0.5
    max_grad_norm: 0.5
    target_kl:
    update_epochs: 10
    share_encoders: false

environment:
    name: Ant-v5
    num_envs: 16

network:
    latent_dim: 64
    max_latent_dim: 256
    arch: mlp
    encoder_config:
        hidden_size:
            - 64
        activation: Tanh
        min_mlp_nodes: 64
        max_mlp_nodes: 256
        layer_norm: false
    head_config:
        hidden_size:
            - 64
        activation: Tanh
        min_hidden_layers: 1
        max_hidden_layers: 3
        min_mlp_nodes: 64
        max_mlp_nodes: 256
        output_vanish: true
        layer_norm: false

# No `mutation` or `tournament_selection` blocks => no HPO: a single agent is
# trained and never mutated or selected. Adding those blocks (with pop_size > 1)
# switches this same script into an HPO regime.

training:
    max_steps: 6_000_000
    target_score:
    pop_size: 1
    evo_steps: 32768
    eval_steps:
    eval_loop: 1
