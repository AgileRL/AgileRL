---
# DeepSpeed baseline for paired gate runs on 2 GPUs (wt-zero3).
# ZeRO-3 to match the FSDP2 full-shard production target; no CPU offload so
# memory/speed compare the sharding strategy rather than offload policy.
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
    gradient_accumulation_steps: 1
    gradient_clipping: 1.0
    offload_optimizer_device: none
    offload_param_device: none
    zero3_init_flag: true
    zero_stage: 3
    gradient_checkpointing: true
mixed_precision: bf16
distributed_type: DEEPSPEED
downcast_bf16: no
enable_cpu_affinity: false
machine_rank: 0
main_training_function: main
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
