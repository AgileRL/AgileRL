---
provider: nebius
name: __CLUSTER_NAME__
arena:
    storage:
        bucket: __CLUSTER_NAME__-data
        endpoint: https://storage.eu-north1.nebius.cloud
        # prefix: models/
        # secret_name: storage
        # install: false
    inference:
        # Dev and staging wildcard: *.{cluster}.inference.agilerl.rlops.ai
        domain: __CLUSTER_NAME__.inference.agilerl.rlops.ai
        # Host part only; FQDN is host + domain.
        hostname_template: inference-{deploymentId}
        # TLS secret in arena. Created as self-signed when missing.
        # tls_secret_name: arena-inference-tls
    gateway:
        # Installs Gateway API v1.6.0 CRDs and enables Cilium Gateway API after provision.
        enable: true
        name: arena
        # ingress_class_name: cilium
    # workloads:
    #   ray_data_pvc_size: 20Gi
terraform_state:
    # Dedicated bucket for Terraform state. Not the experiment-data bucket.
    bucket: __CLUSTER_NAME__-tfstate
    # create_bucket: true
    # key: clusters/__CLUSTER_NAME__/terraform.tfstate
nebius:
    tenant_id: tenant-...
    # Region is required when project_id or storage_project_id is omitted.
    # Provisioning then creates and manages the missing projects, plus a VPC
    # network and subnet for this cluster.
    region: eu-north1
    # Existing Nebius projects and subnet. project_id holds the cluster, VPC, and
    # shared filesystem; storage_project_id holds the experiment bucket and the
    # Terraform state bucket, and destroy keeps it.
    # project_id: project-...
    # storage_project_id: project-...
    # subnet_id: vpcsubnet-...
    # Existing Nebius service account for cluster nodes. Omit to create an
    # "arena" account and add it to the tenant admins group.
    # service_account_id: serviceaccount-...
    system:
        min_node_count: 2
        max_node_count: 10
        platform: cpu-e2
        preset: 2vcpu-8gb
    workers:
        - name: workers
          min_node_count: 0
          max_node_count: 10
          platform: gpu-h100-sxm
          preset: 1gpu-16vcpu-200gb
          gpu_drivers_preset: cuda13.0
    object_storage:
        # Maximum bucket capacity in GiB.
        size_gib: 1024
    shared_filesystem:
        # Set false to create no shared filesystem or node mounts.
        provision: true
        type: NETWORK_SSD
        size_gib: 256
        mount_tag: csi-storage
