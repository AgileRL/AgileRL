---
manifest_version: 2

artifacts:
    setup_script: setup_script.sql
    readme: README.md
    container_services:
        uses_gpu: true
        images:
            - /arena_provider/images/repo/snowflake-job:0.0.0-py313-cu130

configuration:
    log_level: INFO
    trace_level: OFF

lifecycle_callbacks:
    version_initializer: app_code.version_init

privileges:
    - CREATE COMPUTE POOL:
          description: Creates the Pulsar broker, Ray head and GPU worker compute pools that training and serving run on.
    - CREATE WAREHOUSE:
          description: Creates one XSMALL warehouse for exporting the bound table, writing run metrics, and calling a reward function you bind.
    - CREATE EXTERNAL ACCESS INTEGRATION:
          description: Lets training reach Hugging Face for base model weights and the Arena host for run licensing. You approve each host.
    - EXECUTE TASK:
          description: Runs the app's hourly task that bills each finished hour of training usage.
    - EXECUTE MANAGED TASK:
          description: Runs that hourly task on serverless compute, so no warehouse resumes for it.

references:
    - source_table:
          label: Training table
          description: A table the app reads training rows from. Read only.
          privileges:
              - SELECT
          object_type: TABLE
          multi_valued: true
          register_callback: app_code.register_reference
    - source_view:
          label: Training view
          description: A view the app reads training rows from. Put custom SQL in a view and bind it here. Read only.
          privileges:
              - SELECT
          object_type: VIEW
          multi_valued: true
          register_callback: app_code.register_reference
    - export_stage:
          label: Model export stage
          description: A stage of yours that export_model copies trained model files to, so you keep them after uninstalling. Snowflake requires READ alongside
              WRITE.
          privileges:
              - READ
              - WRITE
          object_type: STAGE
          register_callback: app_code.register_reference
    - reward_function:
          label: Reward function
          description: A function of yours that scores completions during post-training, for manifests whose environment.reward is snowflake_function. The
              app calls it with SQL and never reads its code.
          privileges:
              - USAGE
          object_type: FUNCTION
          register_callback: app_code.register_reference
