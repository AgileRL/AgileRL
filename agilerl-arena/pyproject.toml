[project]
name = "agilerl-arena"
version = "0.1.2"
description = "Arena Platform Client Library and CLI."
authors = [{ name = "Nick Ustaran-Anderegg", email = "dev@agilerl.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "click>=8.3.0",
    "lazy-loader>=0.4",
    "httpx>=0.27,<1",
    "numpy>=2.0.0,<3.0",
    "packaging>=20.0",
    "pydantic>=2.0,<3",
    "python-keycloak>=4.0,<8",
    "pyyaml>=6.0",
    "rich>=13.0,<16",
]

[project.scripts]
arena = "agilerl.arena.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Root .gitignore lists /agilerl/arena for the dev symlink; hatch's VCS
# file selection still filters agilerl/arena paths unless this is disabled.
ignore-vcs = true

[tool.hatch.build.targets.wheel]
only-include = ["agilerl/arena"]

[tool.hatch.build.targets.sdist]
only-include = ["agilerl/arena", "README.md"]
