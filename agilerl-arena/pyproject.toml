[project]
name = "agilerl-arena"
dynamic = ["version"]
description = "Arena Platform Client Library and CLI."
authors = [{ name = "Nick Ustaran-Anderegg", email = "dev@agilerl.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "click>=8.3.0",
    "lazy-loader>=0.4",
    "httpx>=0.27,<1",
    "numpy>=2.0.0,<3.0",
    "packaging>=20.0",
    "pydantic>=2.0,<3",
    "python-keycloak>=4.0,<8",
    "pyyaml>=6.0",
    "rich>=13.0,<16",
    # Imported directly (typing_extensions.Self); do not rely on pydantic's
    # transitive pin.
    "typing-extensions>=4.4",
]

[project.optional-dependencies]
# Only `arena memory estimate` / `solve` need these, and only to resolve a model id:
# `AutoConfig` for the geometry and the Hub's safetensors metadata for the
# exact parameter count. Both are imported lazily inside the resolving
# functions, so `--config path/to/config.json` works with neither installed.
hub = [
    "huggingface-hub>=0.30",
    "transformers>=4.40",
]

[project.scripts]
arena = "agilerl.arena.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
search_parent_directories = true
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
tag_regex = "^agilerl-arena/v(?P<version>\\d+\\.\\d+\\.\\d+)$"
git_describe_command = [
    "git",
    "describe",
    "--tags",
    "--abbrev=0",
    "--match",
    "agilerl-arena/v*",
]

[tool.hatch.build]
# Root .gitignore lists /agilerl/arena for the dev symlink; hatch's VCS
# file selection still filters agilerl/arena paths unless this is disabled.
ignore-vcs = true

[tool.hatch.build.targets.wheel]
only-include = ["agilerl/arena"]

[tool.hatch.build.targets.sdist]
only-include = ["agilerl/arena", "README.md"]
