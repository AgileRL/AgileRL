---
# LLMREINFORCE quantization benchmark on a multimodal, long-context gemma model
# over the hard Sudoku env (mirrors cispo_quant_bench.yaml). REINFORCE uses
# Return Batch Normalization (ReBN), not group-relative advantages, so the
# GRPO-family knobs (group_size / adv_norm / filter_zero_adv) do not apply.
# Set algorithm.quantization to none | int8 | nf4 to switch recipe. The model
# below should be a multimodal gemma with ClippableLinear-wrapped projections
# (hence the ``.linear`` LoRA targets and ``lora_target_scope: language_model``).

algorithm:
    name: LLMREINFORCE
    batch_size: 1
    beta: 0
    lr: 0.00005
    clip_coef: 0.2
    gamma: 1.0
    max_grad_norm: 1
    update_epochs: 1
    temperature: 1.0
    advantage_granularity: turn
    importance_sampling_level: turn
    max_output_tokens: 1024
    use_liger_loss: false
    lora_target_scope: language_model
    quantization: none
    activation_offload: false
    use_vllm: true
    vllm_config:
        tensor_parallel_size: 1
        gpu_memory_utilization: 0.3
        max_num_seqs: 8
        sleep_mode: true

environment:
    env_type: multiturn
    env_name: game:Sudoku-v0-hard
    max_turns: 50
    max_reward: 1.0

training:
    max_steps: 100000
    pop_size: 1
    eval_loop: 1
    evaluation_interval: 5

selection_strategy:
    tournament_size: 2
    elitism: true

mutation:
    mutation_sd: 0.1
    rand_seed: 42
    probabilities:
        no_mut: 0.1
        arch_mut: 0.0
        new_layer: 0.0
        params_mut: 0.0
        act_mut: 0.0
        rl_hp_mut: 0.6
    rl_hp_selection:
        lr:
            min: 0.0000001
            max: 0.00001
        beta:
            min: 0.0001
            max: 0.01

network:
    pretrained_model_name_or_path: google/gemma-4-E4B-it
    max_context_length: 32768
    lora_config:
        lora_r: 16
        lora_alpha: 32
        target_modules:
            - q_proj.linear
            - k_proj.linear
            - v_proj.linear
            - o_proj.linear
            - up_proj.linear
            - down_proj.linear
            - gate_proj.linear
        lora_dropout: 0
        task_type: CAUSAL_LM
