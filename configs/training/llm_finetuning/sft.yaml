---
algorithm:
    name: SFT
    batch_size: 16
    lr: 0.00005
    update_epochs: 1
    max_grad_norm: 0.1
    calc_position_embeddings: true

environment:
    env_type: dataset
    objective: sft
    dataset: HumanLLMs/Human-Like-DPO-Dataset
    response_column: chosen

training:
    evo_steps: 10
    pop_size: 1
    eval_loop: 1
    evaluation_interval: 5

network:
    pretrained_model_name_or_path: Qwen/Qwen2.5-0.5B
    max_context_length: 1024
    lora_config:
        lora_r: 16
        lora_alpha: 64
        target_modules:
            - q_proj
            - k_proj
            - v_proj
            - o_proj
        task_type: CAUSAL_LM
