---
algorithm:
    name: DPO
    batch_size: 16
    beta: 0.001
    lr: 0.000005
    update_epochs: 1
    max_grad_norm: 0.1
    calc_position_embeddings: true
    use_separate_reference_adapter: true

environment:
    env_type: dataset
    objective: preference
    dataset: HumanLLMs/Human-Like-DPO-Dataset

training:
    evo_steps: 10
    pop_size: 1
    eval_loop: 1
    evaluation_interval: 5

network:
    pretrained_model_name_or_path: Qwen/Qwen2.5-0.5B
    max_context_length: 1024
    lora_config:
        lora_r: 16
        lora_alpha: 64
        task_type: CAUSAL_LM
