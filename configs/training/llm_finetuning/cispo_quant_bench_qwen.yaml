---
# CISPO quant bench — shrunk variant for a fast learning-signal smoke run on a
# small dense model (ibm-granite/granite-3.3-2b-base) on the easy 4x4 Sudoku env.
# Validates the colocated native-sleep path end to end (bnb nf4 trainer + vLLM
# bitsandbytes rollout, sleep/wake each cycle, trainer base offloaded during
# rollout). Set algorithm.quantization to none | int8 | nf4 to switch recipe.

algorithm:
    name: CISPO
    batch_size: 2
    beta: 0.0
    lr: 0.00002
    clip_coef: [0.8, 2.0]
    max_grad_norm: 1
    update_epochs: 1
    group_size: 4
    temperature: 1.0
    advantage_granularity: turn
    importance_sampling_level: token
    adv_norm: mean_only
    filter_zero_adv: false
    max_output_tokens: 64
    use_liger_loss: true
    use_sequence_packing: true
    vllm_importance_sampling_correction: true
    attn_implementation: flex_attention
    quantization: nf4
    chunk_rows: 64
    activation_offload: true
    use_vllm: true
    vllm_config:
        tensor_parallel_size: 1
        gpu_memory_utilization: 0.3
        max_num_seqs: 8
        sleep_mode: true

environment:
    env_type: multiturn
    env_name: game:GuessTheNumber-v0-easy
    max_turns: 5
    max_reward: 1.0

training:
    max_steps: 4096
    evo_steps: 4096
    pop_size: 1
    eval_loop: 1
    evaluation_interval: 5

selection_strategy:
    tournament_size: 2
    elitism: true

mutation:
    mutation_sd: 0.1
    rand_seed: 42
    probabilities:
        no_mut: 0.1
        arch_mut: 0.0
        new_layer: 0.0
        params_mut: 0.0
        act_mut: 0.0
        rl_hp_mut: 0.6
    rl_hp_selection:
        lr:
            min: 0.0000001
            max: 0.000025
        beta:
            min: 0.0
            max: 0.01
        group_size:
            min: 2
            max: 2

network:
    pretrained_model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
    max_context_length: 8192
    lora_config:
        lora_r: 8
        lora_alpha: 32
        target_modules:
            - q_proj
            - k_proj
            - v_proj
            - o_proj
            - up_proj
            - down_proj
            - gate_proj
        lora_dropout: 0
        task_type: CAUSAL_LM
