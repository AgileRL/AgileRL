---
# CISPO quant bench — shrunk variant for a fast learning-signal smoke run on a
# small dense model (ibm-granite/granite-3.3-2b-base) on the easy 4x4 Sudoku env.
# Validates the colocated native-sleep path end to end (bnb nf4 trainer + vLLM
# bitsandbytes rollout, sleep/wake each cycle, trainer base offloaded during
# rollout). Set algorithm.quantization to none | int8 | nf4 to switch recipe.

algorithm:
    name: CISPO
    batch_size: 2
    beta: 0.0
    lr: 0.00002
    clip_coef: 0.2
    max_grad_norm: 1
    update_epochs: 1
    group_size: 4
    temperature: 1.0
    advantage_granularity: turn
    importance_sampling_level: token
    adv_norm: mean_only
    filter_zero_adv: false
    max_output_tokens: 64
    loss_norm: accumulation_window
    quantization: nf4
    vllm_config:
        tensor_parallel_size: 1
        gpu_memory_utilization: 0.3
        max_num_seqs: 8

environment:
    env_type: rollout
    factory: gem:make
    entrypoint: game:Sudoku-v0-easy
    env_packages:
        uv: [gem-llm==1.0.0]
    max_turns: 8
    max_reward: 1.0

training:
    max_steps: 4096
    evo_steps: 4096
    pop_size: 1
    eval_loop: 1
    evaluation_interval: 5

network:
    pretrained_model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
    max_context_length: 8192
    lora_config:
        lora_r: 8
        lora_alpha: 32
        lora_dropout: 0
        task_type: CAUSAL_LM
