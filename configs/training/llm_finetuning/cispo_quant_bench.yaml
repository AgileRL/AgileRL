---
# CISPO quantization benchmark on a multimodal, long-context gemma model over
# the hard Sudoku env. CISPO is GRPO with the cispo loss variant. Targets the
# colocated bnb-quant + vLLM path; set algorithm.quantization to none | int8 |
# nf4 to switch recipe. The pretrained model below should be a multimodal gemma
# whose attention projections are ClippableLinear-wrapped (hence the
# ``.linear`` LoRA targets and ``lora_target_scope: language_model``).

algorithm:
    name: CISPO
    batch_size: 2
    beta: 0.0
    lr: 0.00002
    clip_coef: [0.8, 2.0]
    max_grad_norm: 1
    update_epochs: 1
    group_size: 4
    temperature: 1.0
    advantage_granularity: turn
    importance_sampling_level: token
    adv_norm: mean_only
    filter_zero_adv: true
    max_output_tokens: 2768
    use_liger_loss: true
    use_sequence_packing: true
    vllm_importance_sampling_correction: true
    attn_implementation: flex_attention
    lora_target_scope: language_model
    quantization: nf4
    activation_offload: true
    chunk_rows: 128
    use_vllm: true
    vllm_config:
        tensor_parallel_size: 1
        gpu_memory_utilization: 0.3
        max_num_seqs: 8
        sleep_mode: true

environment:
    env_type: multiturn
    env_name: game:Sudoku-v0-hard
    max_turns: 50
    max_reward: 1.0

training:
    max_steps: 100000
    pop_size: 1
    eval_loop: 1
    evaluation_interval: 5

tournament_selection:
    tournament_size: 2
    elitism: true

mutation:
    mutation_sd: 0.1
    rand_seed: 42
    probabilities:
        no_mut: 0.1
        arch_mut: 0.0
        new_layer: 0.0
        params_mut: 0.0
        act_mut: 0.0
        rl_hp_mut: 0.6
    rl_hp_selection:
        lr:
            min: 0.0000001
            max: 0.000025
        beta:
            min: 0.0
            max: 0.01
        group_size:
            min: 2
            max: 2

network:
    pretrained_model_name_or_path: google/gemma-4-E4B-it
    max_context_length: 32768
    lora_config:
        lora_r: 2
        lora_alpha: 32
        target_modules:
            - q_proj.linear
            - k_proj.linear
            - v_proj.linear
            - o_proj.linear
            - up_proj.linear
            - down_proj.linear
            - gate_proj.linear
        lora_dropout: 0
        task_type: CAUSAL_LM
