---
algorithm:
    name: CQN
    batch_size: 256
    lr: 0.001
    learn_step: 1
    gamma: 0.99
    tau: 0.001
    double: true

environment:
    name: CartPole-v1
    num_envs: 16
    minari_dataset_id: cartpole/random-v0
mutation:
    probabilities:
        no_mut: 0.4
        arch_mut: 0.2
        new_layer: 0.2
        params_mut: 0.2
        act_mut: 0.2
        rl_hp_mut: 0.2
    rl_hp_selection:
        lr:
            min: 0.0001
            max: 0.01
        batch_size:
            min: 8
            max: 1024
        learn_step:
            min: 1
            max: 10
    mutation_sd: 0.1
    rand_seed: 42
    super_param_mut: true      # apply the amplified Gaussian band
    reset_param_mut: true      # apply the reset Gaussian band
    regrama_param_mut: false   # do not reset dormant neurons

network:
    latent_dim: 64
    arch: mlp
    encoder_config:
        hidden_size:
            - 64
    head_config:
        hidden_size:
            - 64

replay_buffer:
    max_size: 100_000

# MF-PBT replaces tournament selection (both share this block, discriminated by
# strategy). The recommended MF-PBT configuration is defined
selection_strategy:
    strategy: multi_frequency
    n_subpopulations: 2
    n_winners: 2
    n_survivors: 0
    n_open_for_migration: 2
    n_losers: 4
    evolution_frequency_ratios: [1, 5]

training:
    max_steps: 50_000
    target_score: 200.0
    pop_size: 16  # MF-PBT population size (2 subpopulations of 8 agents)
    evo_steps: 5_000
    eval_steps:
    eval_loop: 1
    learning_delay: 1000
