---
name: Type checks

on:
    push:
        branches: [main, nightly]
        paths:
            - agilerl/**
            - agilerl-arena/**
            - .github/workflows/**
            - pyproject.toml
            - uv.lock
    pull_request:
        paths:
            - agilerl/**
            - agilerl-arena/**
            - .github/workflows/**
            - pyproject.toml
            - uv.lock

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    ty:
        runs-on: gha-runner-scale-set
        env:
            UV_CACHE_DIR: /tmp/uv-cache
            UV_PROJECT_ENVIRONMENT: /tmp/agilerl-venv
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
                  python-version: '3.10'

            # All extras so every resolvable import (vllm, transformers,
            # agilerl-arena, ...) is visible to the checker.
            - name: Install dependencies
              run: uv sync --locked --all-groups --extra all

            # agilerl.arena is a pkgutil-style namespace portion shipped by
            # agilerl-arena; static checkers need the dev symlink to see it.
            - name: Create arena namespace symlink
              run: ln -s ../agilerl-arena/agilerl/arena agilerl/arena

            # ty is not a project dependency; it is pinned by the
            # astral-sh/ty-pre-commit rev in .pre-commit-config.yaml. Keep this
            # version in step with that rev. --with overlays ty onto the synced
            # project environment so it can still resolve third-party imports.
            - name: Run ty
              run: uv run --with ty==0.0.61 ty check agilerl agilerl/arena
