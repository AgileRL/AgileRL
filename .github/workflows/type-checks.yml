---
name: Type checks

on:
    pull_request:
        paths:
            - agilerl/**
            - agilerl-arena/**
            - .github/workflows/**
            - pyproject.toml
            - uv.lock

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    ty:
        runs-on: gha-runner-scale-set
        env:
            UV_CACHE_DIR: /tmp/uv-cache
            UV_PROJECT_ENVIRONMENT: /tmp/agilerl-venv
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
                  python-version: '3.13'

            # All extras so every resolvable import (vllm, transformers,
            # agilerl-arena, ...) is visible to the checker.
            - name: Install dependencies
              run: uv sync --locked --all-groups --extra all

            # agilerl.arena is a pkgutil-style namespace portion shipped by
            # agilerl-arena; static checkers need the dev symlink to see it.
            - name: Create arena namespace symlink
              run: ln -s ../agilerl-arena/agilerl/arena agilerl/arena

            - name: Run ty
              run: uv run pre-commit run ty --all-files
