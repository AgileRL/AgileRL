---
name: CI durations

on:
    workflow_run:
        workflows: [CI]
        types: [completed]

permissions:
    contents: read
    actions: write

jobs:
    promote:
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.13'
            - name: Download 3.13 CPU junit
              uses: actions/download-artifact@v4
              with:
                  pattern: junit-linux-cpu-3.13-*
                  path: junit-cpu
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ github.token }}
            - name: Merge CPU durations
              run: |
                  python3 scripts/pytest_shard.py merge-junit \
                    --out .ci-durations/cpu.json \
                    junit-cpu
            - name: Cache CPU test durations
              uses: actions/cache/save@v4
              with:
                  path: .ci-durations/cpu.json
                  key: linux-cpu-durations-${{ github.event.workflow_run.id }}
            - name: Download 3.13 GPU junit
              uses: actions/download-artifact@v4
              with:
                  pattern: junit-linux-gpu-3.13-*
                  path: junit-gpu
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ github.token }}
            - name: Merge GPU durations
              run: |
                  python3 scripts/pytest_shard.py merge-junit \
                    --out .ci-durations/gpu.json \
                    junit-gpu
            - name: Cache GPU test durations
              uses: actions/cache/save@v4
              with:
                  path: .ci-durations/gpu.json
                  key: linux-gpu-durations-${{ github.event.workflow_run.id }}
