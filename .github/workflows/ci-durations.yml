---
name: CI durations

on:
    workflow_run:
        workflows: [CI]
        types: [completed]

permissions:
    contents: read
    actions: write

jobs:
    promote:
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.13'
            - name: Download 3.13 CPU junit
              id: cpu-junit
              continue-on-error: true
              uses: actions/download-artifact@v4
              with:
                  pattern: junit-linux-cpu-3.13-*
                  path: junit-cpu
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ github.token }}
                  if-no-files-found: error
            - name: Merge CPU durations
              id: cpu-merge
              if: steps.cpu-junit.outcome == 'success'
              continue-on-error: true
              run: |
                  set -eu
                  mkdir -p .ci-durations
                  python3 scripts/pytest_shard.py merge-junit \
                    --out .ci-durations/cpu.json \
                    junit-cpu/*/*.xml
                  python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1], encoding="utf-8")) else 1)' \
                    .ci-durations/cpu.json
            - name: Cache CPU test durations
              if: steps.cpu-merge.outcome == 'success'
              uses: actions/cache/save@v4
              with:
                  path: .ci-durations/cpu.json
                  key: linux-cpu-durations-${{ github.event.workflow_run.id }}
            - name: Download 3.13 GPU junit
              id: gpu-junit
              continue-on-error: true
              uses: actions/download-artifact@v4
              with:
                  pattern: junit-linux-gpu-3.13-*
                  path: junit-gpu
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ github.token }}
                  if-no-files-found: error
            - name: Merge GPU durations
              id: gpu-merge
              if: steps.gpu-junit.outcome == 'success'
              continue-on-error: true
              run: |
                  set -eu
                  mkdir -p .ci-durations
                  python3 scripts/pytest_shard.py merge-junit \
                    --out .ci-durations/gpu.json \
                    junit-gpu/*/*.xml
                  python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1], encoding="utf-8")) else 1)' \
                    .ci-durations/gpu.json
            - name: Cache GPU test durations
              if: steps.gpu-merge.outcome == 'success'
              uses: actions/cache/save@v4
              with:
                  path: .ci-durations/gpu.json
                  key: linux-gpu-durations-${{ github.event.workflow_run.id }}
