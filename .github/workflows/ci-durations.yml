---
name: CI durations

on:
    workflow_run:
        workflows: [CI]
        types: [completed]

permissions:
    contents: read
    actions: write

jobs:
    promote:
        if: github.event.workflow_run.conclusion == 'success'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - family: cpu
                      runner: ubuntu-24.04
                    - family: gpu
                      runner: gha-runner-scale-set
        # actions/cache versions by compressor; this must match linux / ${{ matrix.family }}.
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v4
            - name: Download 3.13 ${{ matrix.family }} junit
              uses: actions/download-artifact@v4
              with:
                  pattern: junit-linux-${{ matrix.family }}-3.13-*
                  path: junit-${{ matrix.family }}
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ github.token }}
            - name: Merge ${{ matrix.family }} durations
              run: |
                  python3 scripts/pytest_shard.py merge-junit \
                    --out .ci-durations/${{ matrix.family }}.json \
                    junit-${{ matrix.family }}
            - name: Cache ${{ matrix.family }} test durations
              uses: actions/cache/save@v4
              with:
                  path: .ci-durations/${{ matrix.family }}.json
                  key: linux-${{ matrix.family }}-durations-${{ github.event.workflow_run.id }}
