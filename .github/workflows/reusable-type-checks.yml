---
name: Type checks

on:
    workflow_call:

permissions:
    contents: read

jobs:
    ty:
        runs-on: ubuntu-24.04
        env:
            UV_CACHE_DIR: /tmp/uv-cache
        steps:
            - uses: actions/checkout@v5
            - uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
                  python-version: '3.13'
            - name: Install dependencies
              run: uv sync --locked --group dev --extra snowflake-job
            # The ty hook resolves imports from the project .venv.
            - name: Run ty
              run: uvx pre-commit run ty --all-files
