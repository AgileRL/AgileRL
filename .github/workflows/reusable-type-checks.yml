---
name: Type checks

on:
    workflow_call:

permissions:
    contents: read

jobs:
    ty:
        runs-on: ubuntu-24.04
        env:
            UV_CACHE_DIR: /tmp/uv-cache
            UV_PROJECT_ENVIRONMENT: /tmp/agilerl-venv
        steps:
            - uses: actions/checkout@v5
            - uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
                  python-version: '3.13'

            # CPU torch + llm extras. vllm and CUDA wheels do not fit hosted disk.
            - name: Install dependencies
              run: uv sync --locked --group dev --extra box2d --extra llm --extra cpu

            # agilerl.arena is a pkgutil-style namespace portion shipped by
            # agilerl-arena; static checkers need the dev symlink to see it.
            - name: Create arena namespace symlink
              run: ln -s ../agilerl-arena/agilerl/arena agilerl/arena

            - name: Run ty
              run: uv run pre-commit run ty --all-files
