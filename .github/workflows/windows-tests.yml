---
name: Windows

on:
    push:
        branches: [main, nightly]
        paths:
            - agilerl/**
            - agilerl-arena/**
            - tests/**
            - .github/workflows/**
            - pyproject.toml
            - uv.lock
    pull_request:
        branches: [main, nightly]
        paths:
            - agilerl/**
            - agilerl-arena/**
            - tests/**
            - .github/workflows/**
            - pyproject.toml
            - uv.lock

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    tests:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            max-parallel: 4
            matrix:
                os: [windows-2025]
                python-version: ['3.10', '3.11', '3.12', '3.13']

        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
                  python-version: ${{ matrix.python-version }}
            - name: Install dependencies
              run: |
                  pip install uv
                  uv sync --locked --all-groups --extra all

            - name: Test with pytest
              shell: bash
              # Cap xdist at 2 workers on Windows.
              # The -n here overrides the "-n auto" in pyproject's addopts.
              run: bash scripts/run-tests.sh cov -n 2 --exitfirst -m "not llm" --cov-report=term-missing --durations=0 --durations-min=1.0
