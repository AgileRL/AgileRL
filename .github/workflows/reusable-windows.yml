---
name: Windows

on:
    workflow_call:

permissions:
    contents: read

jobs:
    tests:
        runs-on: windows-2025
        timeout-minutes: 40
        env:
            # Native App tests import snowflake_app from the repository root.
            PYTHONPATH: ${{ github.workspace }}
        steps:
            - uses: actions/checkout@v5
            - uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
                  python-version: '3.13'
            - name: Install dependencies
              run: uv sync --locked --group dev --extra snowflake-job
            - name: Run tests
              shell: bash
              run: uv run --no-sync python -m pytest tests snowflake_app/tests --import-mode=importlib --junitxml=junit-windows.xml
            - name: Upload junit
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: junit-windows-3.13
                  path: junit-windows.xml
                  if-no-files-found: ignore
