---
name: Windows

on:
    workflow_call:

permissions:
    contents: read

jobs:
    tests:
        runs-on: windows-2025
        strategy:
            fail-fast: false
            max-parallel: 8
            matrix:
                python-version: ['3.10', '3.11', '3.12', '3.13']
                shard: [1, 2]
        env:
            PYTHONPATH: ${{ github.workspace }}/agilerl-arena

        steps:
            - uses: actions/checkout@v5
            - uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
                  python-version: ${{ matrix.python-version }}
            - name: Restore Windows test durations
              uses: actions/cache/restore@v4
              with:
                  path: .ci-durations/windows.json
                  key: windows-cpu-durations-${{ github.run_id }}
                  restore-keys: windows-cpu-durations-
            - name: Install dependencies
              run: |
                  pip install uv
                  uv sync --locked --all-groups --extra all

            - name: Show runner CPU
              run: Get-CimInstance Win32_Processor | Select-Object Name, Manufacturer | Format-List

            - name: Run Windows shard
              shell: bash
              # Cap CPU-ISA dispatch at AVX2: part of the heterogeneous Azure fleet
              # behind windows-2025 runners faults (0xc000001d, illegal instruction)
              # in torch's native kernel threads when an above-AVX2 code path is
              # selected. AVX2 is supported fleet-wide.
              env:
                  ATEN_CPU_CAPABILITY: avx2
                  ONEDNN_MAX_CPU_ISA: AVX2
                  MKL_ENABLE_INSTRUCTIONS: AVX2
              run: |
                  rm -f .coverage .coverage.*
                  uv run python scripts/pytest_shard.py run \
                    --root tests \
                    --root agilerl-arena/tests \
                    --total-shards 2 \
                    --shard-index ${{ matrix.shard }} \
                    --durations-file .ci-durations/windows.json \
                    -- \
                    --import-mode=importlib \
                    --junitxml=junit-windows.xml \
                    -m "not llm and not gpu and not vllm" \
                    -n auto --dist loadgroup \
                    --durations=15 \
                    --cov --cov-report=term-missing
            - name: Upload junit
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: junit-windows-${{ matrix.python-version }}-${{ matrix.shard }}
                  path: junit-windows.xml
                  if-no-files-found: ignore
