---
name: Linux

on:
    workflow_call:
        inputs:
            pythons:
                description: JSON list of Python versions
                type: string
                required: true

permissions:
    contents: read

jobs:
    tests:
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                python-version: ${{ fromJSON(inputs.pythons) }}
        env:
            UV_CACHE_DIR: /tmp/uv-cache
            UV_PROJECT_ENVIRONMENT: /tmp/agilerl-venv
            CUDA_VISIBLE_DEVICES: ''
            # Native App tests import snowflake_app from the repository root.
            PYTHONPATH: ${{ github.workspace }}
        steps:
            - uses: actions/checkout@v5
            - uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
                  python-version: ${{ matrix.python-version }}
            - name: Install dependencies
              run: uv sync --locked --group dev --extra snowflake-job
            - name: Run tests
              run: uv run --no-sync python -m pytest tests snowflake_app/tests --import-mode=importlib --junitxml=junit-linux.xml
            - name: Upload junit
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: junit-linux-${{ matrix.python-version }}
                  path: junit-linux.xml
                  if-no-files-found: ignore
