---
name: CI
# Hub dispatches carry scope and gate so the hub waits on the run it started.
# GitHub pull requests gate nothing: hub-sync-import turns them into GitLab
# MRs, which test, review and merge them. Their runs use the affected scope
# (Linux 3.13 and ty) so they leave hosted capacity to the hub's runs.
run-name: >-
    ${{ github.event_name == 'workflow_dispatch' && format('CI {0} {1}', inputs.scope, inputs.gate)
    || github.event_name == 'schedule' && 'CI nightly'
    || format('CI affected #{0} {1}', github.event.pull_request.number, github.event.pull_request.title) }}

on:
    pull_request:
        branches: [main]
        paths:
            - agilerl/**
            - tests/**
            - snowflake_app/**
            - .github/workflows/**
            - pyproject.toml
            - uv.lock
    workflow_dispatch:
        inputs:
            scope:
                description: full runs every job; affected runs Linux 3.13 and ty
                type: choice
                options: [full, affected]
                default: full
            gate:
                description: Caller id echoed in the run name
                type: string
                default: ''
    schedule:
        - cron: 0 2 * * *

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    linux:
        uses: ./.github/workflows/reusable-linux.yml
        with:
            pythons: ${{ (inputs.scope == 'affected' || github.event_name == 'pull_request') && '["3.13"]' || '["3.10", "3.11", "3.12", "3.13"]' }}
    macos:
        if: inputs.scope == 'full' || github.event_name == 'schedule'
        uses: ./.github/workflows/reusable-macos.yml
    windows:
        if: inputs.scope == 'full' || github.event_name == 'schedule'
        uses: ./.github/workflows/reusable-windows.yml
    ty:
        uses: ./.github/workflows/reusable-type-checks.yml
    codeql:
        if: inputs.scope != 'affected' && github.event_name != 'pull_request'
        uses: ./.github/workflows/codeql.yml
        permissions:
            contents: read
            actions: read
            packages: read
            security-events: write
