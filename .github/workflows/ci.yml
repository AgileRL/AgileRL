---
name: CI

on:
    pull_request:
        branches: [main]
        paths:
            - agilerl/**
            - agilerl-arena/**
            - tests/**
            - .github/workflows/**
            - pyproject.toml
            - uv.lock
    workflow_dispatch:
    # PRs and hub MRs run GPU tests on 3.13 only; this run covers every version.
    schedule:
        - cron: 0 2 * * *

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    linux:
        uses: ./.github/workflows/reusable-linux.yml
        secrets: inherit
        with:
            all_gpu_pythons: ${{ github.event_name == 'schedule' }}
    macos:
        uses: ./.github/workflows/reusable-macos.yml
    windows:
        uses: ./.github/workflows/reusable-windows.yml
    ty:
        uses: ./.github/workflows/reusable-type-checks.yml
    codeql:
        uses: ./.github/workflows/codeql.yml
        permissions:
            contents: read
            actions: read
            packages: read
            security-events: write
