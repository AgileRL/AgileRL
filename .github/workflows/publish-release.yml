---
name: Publish release

# Public PyPI path for spoke tags. Uploads the already-published wheel/sdist
# for those tags. Does not rebuild. Does not publish to any private index.
#
#   vX.Y.Z              → latest agilerl-arena in this tree's extra range,
#                         then agilerl (same order as `just publish`)
#   agilerl-arena/vX.Y.Z → agilerl-arena only
#
# Trigger: workflow_dispatch from an existing tag ref (Use workflow from).
# No inputs. Tag push does not publish; minting spoke tags from hub must not
# upload to PyPI.
#
# Auth:
#   fetch   — GitHub OIDC → read-only IAM role (repository secret
#             AWS_CODEARTIFACT_READ_ROLE_ARN). No long-lived AWS keys.
#   publish — PyPI Trusted Publishing (OIDC) via environment `pypi`.
#             No UV_PUBLISH_TOKEN. Fetch credentials do not leak into publish.
#   release — GITHUB_TOKEN creates the GitHub Release after PyPI succeeds.
#             Title and body come from spoke commit messages (spoke-public
#             copy), not GitHub generate-notes.

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    fetch:
        if: github.repository == 'AgileRL/AgileRL'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        outputs:
            tag: ${{ steps.plan.outputs.tag }}
            version: ${{ steps.plan.outputs.version }}
            dist_name: ${{ steps.plan.outputs.dist_name }}
            package: ${{ steps.plan.outputs.package }}
            previous_tag: ${{ steps.plan.outputs.previous_tag }}
        steps:
            - name: Require tag ref
              run: |
                  set -euo pipefail
                  if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
                    echo "Run this workflow from a v* or agilerl-arena/v* tag (Use workflow from), not ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}" >&2
                    exit 1
                  fi

            - name: Checkout fetch script
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false
                  fetch-depth: 1

            - name: Plan packages
              id: plan
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  TAG="${TAG#refs/tags/}"
                  tags="$(
                    gh api --paginate \
                      "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags" \
                      --jq '.[].ref' \
                      | sed 's#^refs/tags/##'
                  )"
                  printf '%s\n' "${tags}" | python3 scripts/spoke_pypi_plan.py \
                    --tag "${TAG}" \
                    --pyproject pyproject.toml \
                    --json-out plan.json \
                    --github-output "$GITHUB_OUTPUT"

            - name: Require read role
              env:
                  AWS_CODEARTIFACT_READ_ROLE_ARN: ${{ secrets.AWS_CODEARTIFACT_READ_ROLE_ARN }}
              run: |
                  set -euo pipefail
                  if [[ -z "${AWS_CODEARTIFACT_READ_ROLE_ARN:-}" ]]; then
                    echo "Set repository secret AWS_CODEARTIFACT_READ_ROLE_ARN to the read-only IAM role ARN." >&2
                    exit 1
                  fi

            - name: Configure AWS credentials (OIDC, read-only)
              uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
              with:
                  role-to-assume: ${{ secrets.AWS_CODEARTIFACT_READ_ROLE_ARN }}
                  aws-region: us-east-1
                  audience: sts.amazonaws.com
                  role-session-name: agilerl-pypi-fetch
                  role-duration-seconds: 900
                  mask-aws-account-id: true
                  allowed-account-ids: '761296822462'

            - name: Fetch INTERNAL dist
              run: |
                  set -euo pipefail
                  rm -rf dist
                  mkdir -p dist
                  while IFS=$'\t' read -r pkg ver; do
                    python3 scripts/fetch_arena_internal_dist.py \
                      --package "${pkg}" \
                      --version "${ver}" \
                      --out-dir dist \
                      --domain agilerl-pypi \
                      --domain-owner 761296822462 \
                      --repository arena \
                      --region us-east-1
                  done < <(
                    python3 scripts/spoke_pypi_plan.py --print-fetch --plan plan.json
                  )

            - name: Upload dist
              uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
              with:
                  name: pypi-dist
                  path: dist/
                  if-no-files-found: error

            - name: Upload plan
              uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
              with:
                  name: pypi-plan
                  path: plan.json
                  if-no-files-found: error

    publish:
        needs: fetch
        if: github.repository == 'AgileRL/AgileRL'
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download dist
              uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
              with:
                  name: pypi-dist
                  path: dist

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  enable-cache: false

            - name: Publish to PyPI (OIDC)
              env:
                  PKG: ${{ needs.fetch.outputs.package }}
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  arena=(dist/agilerl_arena-*)
                  core=(dist/agilerl-[0-9]*)
                  if [[ "${PKG}" == agilerl-arena && ${#arena[@]} -eq 0 ]]; then
                    echo "missing dist artifacts for agilerl-arena"; ls -la dist; exit 1
                  fi
                  if [[ "${PKG}" == agilerl && ${#core[@]} -eq 0 ]]; then
                    echo "missing dist artifacts for agilerl"; ls -la dist; exit 1
                  fi
                  # Skip artifacts already on PyPI so a retry can finish.
                  if [[ ${#arena[@]} -gt 0 ]]; then
                    echo "Publishing agilerl-arena first via Trusted Publishing"
                    uv publish --trusted-publishing always --check-url https://pypi.org/simple "${arena[@]}"
                  fi
                  if [[ ${#core[@]} -gt 0 ]]; then
                    echo "Publishing agilerl via Trusted Publishing"
                    uv publish --trusted-publishing always --check-url https://pypi.org/simple "${core[@]}"
                  fi

    github-release:
        needs: [fetch, publish]
        if: github.repository == 'AgileRL/AgileRL'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout notes script
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false
                  fetch-depth: 1

            - name: Download dist
              uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
              with:
                  name: pypi-dist
                  path: dist

            - name: Download plan
              uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
              with:
                  name: pypi-plan
                  path: .

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  python3 scripts/spoke_github_releases.py \
                    --plan plan.json \
                    --dist dist \
                    --repo "${GITHUB_REPOSITORY}"
