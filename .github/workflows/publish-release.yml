name: Publish release

# Stable PyPI path for spoke tags v* (proposal §4.6.5).
# Hub never publishes stable agilerl to PyPI (D1) — this workflow lives in the spoke tree only.
# Trigger: push of tag vX.Y.Z, or workflow_dispatch with an explicit tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing spoke tag to publish (e.g. v2.9.0). Empty = the ref that triggered the run."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write  # Trusted Publishing to PyPI

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#refs/tags/}"
          case "${TAG}" in
            v*) VER="${TAG#v}" ;;
            *) echo "ref ${TAG} is not a v* release tag"; exit 1 ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Verify tag matches pyproject versions
        run: |
          set -euo pipefail
          VER="${{ steps.tag.outputs.version }}"
          PY_VER="$(python3 -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          test "${PY_VER}" = "${VER}"
          echo "Publishing agilerl==${PY_VER} (and workspace agilerl-arena) from tag ${{ steps.tag.outputs.tag }}"

      - name: Build
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --package agilerl-arena
          uv build --package agilerl
          python3 scripts/check-extras.py

      - name: Publish to PyPI
        env:
          # Optional emergency bootstrap; prefer Trusted Publishing (OIDC) with empty token.
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          arena=(dist/agilerl_arena-*)
          core=(dist/agilerl-[0-9]*)
          if [[ ${#arena[@]} -eq 0 || ${#core[@]} -eq 0 ]]; then
            echo "missing dist artifacts"; ls -la dist; exit 1
          fi
          if [[ -n "${UV_PUBLISH_TOKEN:-}" ]]; then
            uv publish "${arena[@]}"
            uv publish "${core[@]}"
          else
            uv publish --trusted-publishing always "${arena[@]}"
            uv publish --trusted-publishing always "${core[@]}"
          fi
