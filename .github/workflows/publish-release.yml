---
name: Publish release

# Stable PyPI path for spoke tags (§4.6.5 / D7).
# Hub never publishes stable agilerl / agilerl-arena to PyPI (D1) — this workflow
# lives in the spoke tree only.
#
# Triggers:
#   v*                  → publish agilerl only (≡ hub agilerl/v*)
#   agilerl-arena/v*    → publish agilerl-arena only (≡ hub agilerl-arena/v*)
#
# Preferred trigger: workflow_dispatch from an existing release tag ref (pairs with
# environment `pypi` required reviewers + tag deployment policy). Tag push remains
# for §4.6.5; protect refs/tags/v* and refs/tags/agilerl-arena/v* via GitHub rulesets.
#
# Auth: PyPI Trusted Publishing (OIDC) only — no long-lived UV_PUBLISH_TOKEN.
# Bind PyPI trusted publisher to owner AgileRL, repo AgileRL, this workflow, environment `pypi`.

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Existing spoke tag to publish (e.g. v2.9.0 or agilerl-arena/v0.2.0). Empty = the ref that triggered the run.
                required: false
                default: ''
    push:
        tags:
            - v*
            - agilerl-arena/v*

permissions:
    contents: read

jobs:
    build:
        if: github.repository == 'AgileRL/AgileRL'
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.tag.outputs.tag }}
            version: ${{ steps.tag.outputs.version }}
            package: ${{ steps.tag.outputs.package }}
        steps:
            - name: Resolve tag
              id: tag
              env:
                  INPUT_TAG: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  if [[ -n "${INPUT_TAG}" ]]; then
                    TAG="${INPUT_TAG}"
                  else
                    TAG="${GITHUB_REF_NAME}"
                  fi
                  TAG="${TAG#refs/tags/}"
                  case "${TAG}" in
                    agilerl-arena/v*)
                      PACKAGE=agilerl-arena
                      VER="${TAG#agilerl-arena/v}"
                      ;;
                    v*)
                      PACKAGE=agilerl
                      VER="${TAG#v}"
                      ;;
                    *)
                      echo "ref ${TAG} is not a v* or agilerl-arena/v* release tag"
                      exit 1
                      ;;
                  esac
                  echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
                  echo "version=${VER}" >> "$GITHUB_OUTPUT"
                  echo "package=${PACKAGE}" >> "$GITHUB_OUTPUT"

            - name: Checkout tag
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  ref: ${{ steps.tag.outputs.tag }}

            - name: Install uv
              uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

            - name: Verify tag matches pyproject version
              env:
                  VER: ${{ steps.tag.outputs.version }}
                  TAG: ${{ steps.tag.outputs.tag }}
                  PACKAGE: ${{ steps.tag.outputs.package }}
              run: |
                  set -euo pipefail
                  case "${PACKAGE}" in
                    agilerl)
                      PYPROJECT=pyproject.toml
                      ;;
                    agilerl-arena)
                      PYPROJECT=agilerl-arena/pyproject.toml
                      ;;
                    *)
                      echo "unknown package ${PACKAGE}"; exit 1
                      ;;
                  esac
                  PY_VER="$(python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('${PYPROJECT}').read_text())['project']['version'])")"
                  test "${PY_VER}" = "${VER}"
                  echo "Building ${PACKAGE}==${PY_VER} from tag ${TAG}"

            - name: Build
              env:
                  PACKAGE: ${{ steps.tag.outputs.package }}
              run: |
                  set -euo pipefail
                  rm -rf dist
                  uv build --package "${PACKAGE}"
                  if [[ "${PACKAGE}" == "agilerl" ]]; then
                    python3 scripts/check-extras.py
                  fi

            - name: Upload dist
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: pypi-dist
                  path: dist/
                  if-no-files-found: error

    publish:
        needs: build
        if: github.repository == 'AgileRL/AgileRL'
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download dist
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: pypi-dist
                  path: dist

            - name: Install uv
              uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

            - name: Publish to PyPI (OIDC)
              env:
                  TAG: ${{ needs.build.outputs.tag }}
                  VER: ${{ needs.build.outputs.version }}
                  PACKAGE: ${{ needs.build.outputs.package }}
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  case "${PACKAGE}" in
                    agilerl)
                      artifacts=(dist/agilerl-[0-9]*)
                      ;;
                    agilerl-arena)
                      artifacts=(dist/agilerl_arena-*)
                      ;;
                    *)
                      echo "unknown package ${PACKAGE}"; exit 1
                      ;;
                  esac
                  if [[ ${#artifacts[@]} -eq 0 ]]; then
                    echo "missing dist artifacts for ${PACKAGE}"; ls -la dist; exit 1
                  fi
                  echo "Publishing ${PACKAGE}==${VER} from tag ${TAG} via Trusted Publishing"
                  uv publish --trusted-publishing always "${artifacts[@]}"
