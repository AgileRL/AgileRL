---
name: macOS

on:
    workflow_call:

permissions:
    contents: read

jobs:
    tests:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            max-parallel: 4
            matrix:
                os: [macos-26]
                python-version: ['3.10', '3.11', '3.12', '3.13']

        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
                  python-version: ${{ matrix.python-version }}
            - name: Install dependencies
              run: |
                  uv sync --locked --all-groups --extra all

            - name: Test with pytest
              run: bash scripts/run-tests.sh cov junit --cov-report=term-missing --durations=0 --durations-min=1.0
            - name: Upload junit
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: junit-macos-${{ matrix.python-version }}
                  path: junit-*.xml
                  if-no-files-found: ignore
