---
name: CodeQL Advanced

on:
    push:
        branches: [main]
    schedule:
        - cron: 40 9 * * 4

permissions:
    contents: read

jobs:
    codeql:
        uses: ./.github/workflows/reusable-codeql.yml
        permissions:
            contents: read
            actions: read
            packages: read
            security-events: write
