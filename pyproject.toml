[project]
name = "agilerl"
version = "2.9.0.dev1"
description = "AgileRL is a deep reinforcement learning library focused on improving RL development through RLOps."
authors = [{ name = "Nick Ustaran-Anderegg", email = "dev@agilerl.com" }]
license = "Apache-2.0"
readme = "README.md"

requires-python = ">=3.10,<3.14"

dependencies = [
    "accelerate>=1.7.0",
    "dill>=0.3.7",
    "fastrand>=1.3.0",
    "flatten_dict>=0.4.2",
    "gymnasium>=1.0.0",
    "google-cloud-storage>=2.5.0",
    "h5py>=3.15.0",
    "hydra-core>=1.3.2",
    "matplotlib>=3.9.4",
    "minari[all]>=0.5.2",
    "numpy>=2.0.0,<3.0",
    "omegaconf>=2.3.0",
    "pandas>=2.2.3",
    "pettingzoo>=1.23.1,<1.27",
    # MPE envs, moved out of pettingzoo into their own package as of 1.25.
    "mpe2>=1.1.0",
    "jax[cpu]>=0.4.31",
    "lazy-loader>=0.4",
    "packaging>=20.0",
    "pre-commit>=3.8.0",
    "pydantic>=2.0,<3",
    "pygame-ce>=2.5.0",
    "pymunk>=6.2,<7.4",
    "redis>=4.4.4,<8.2.0",
    "rich>=13.0,<16",
    "SuperSuit>=3.9.0",
    "tabulate>=0.9.0",
    "termcolor>=1.1.0",
    "torch>=2.11.0",
    "tensordict==0.13.0",
    "tqdm>=4.66.4",
    "wandb>=0.18.0",
]

[project.optional-dependencies]
box2d = [
    "swig>=4.4.1; sys_platform != 'win32'",
    "gymnasium[box2d]>=1.0.0; sys_platform != 'win32'",
]
llm = [
    "bitsandbytes==0.49.2; sys_platform == 'linux'",
    "datasets==5.0.1",
    "deepspeed>=0.19.1; sys_platform == 'linux'",
    "liger-kernel==0.8.1; sys_platform == 'linux'",
    "peft==0.19.1",
    "transformers==5.14.1",
    "vllm>=0.24; sys_platform == 'linux'",
]
arena = [
    "agilerl-arena==0.1.2",
]
all = [
    "agilerl[box2d,llm,arena]",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.2.0",
    "pytest-xdist>=3.5",
    "nvidia-ml-py>=12.0.0",  # For GPU memory monitoring in tests
]
docs = [
    "furo>=2025.12.19",
    "sphinx>=7,<9",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "sphinx-github-changelog>=1.7.1",
    "sphinx-notfound-page>=1.1.0",
    "sphinx-toolbox>=4.1.2",
    "sphinxcontrib-googleanalytics>=0.5",
]

[tool.uv.workspace]
members = ["agilerl-arena"]

[tool.uv.sources]
agilerl-arena = { workspace = true }

[tool.pytest.ini_options]
addopts = [
    "-n", "auto",
    "--dist", "loadgroup",
    "--durations=0",
    "--durations-min=1.0",
]
env = [
    "PYTHONHASHSEED=0",
    "VLLM_USE_FLASHINFER_SAMPLER=0",
    "PYTORCH_ENABLE_MPS_FALLBACK=1",
]
filterwarnings = [
    # MakeEvolvable deprecation (use EvolvableModule/EvolvableNetwork instead)
    "ignore::DeprecationWarning:agilerl.wrappers.make_evolvable",
    # HPO: activation mutations not supported for some algorithms
    "ignore:Activation mutations are not supported for .*:UserWarning:agilerl.hpo.mutation",
    # Pygame/setuptools warnings
    "ignore:pkg_resources is deprecated",
    "ignore:Deprecated call to `pkg_resources.*",
    # Matplotlib/pyparsing deprecation warnings in test environment
    "ignore::pyparsing.exceptions.PyparsingDeprecationWarning",
]
markers = [
    "vllm: tests that actually instantiate vllm.LLM (exclude with -m 'not vllm'). Pinned to a single xdist worker because vLLM's GPU memory profiling fails when peer workers free memory mid-init.",
    "gpu: tests that use a GPU (CUDA, DeepSpeed, etc.) but do NOT initialise real vLLM (exclude with -m 'not gpu'). Safe to fan out across multiple xdist workers.",
]

[tool.coverage.run]
source = ["agilerl", "agilerl-arena/agilerl"]
parallel = true
concurrency = ["multiprocessing", "thread"]
sigterm = true

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# box2d has a bug where it doesn't declare swig as a build dependency.
# This workaround tells uv to build box2d-py using the project environment directly
# (not an isolated one), where it can see system PATH and find swig, which is already installed as a dependency
# (no-build-isolation packages are built after the others).
#
# DeepSpeed can be built with env vars to specify compiler flags
# e.g. DS_BUILD_FUSED_ADAM=1 is essential on L4 GPU
# to pre-build the fused Adam kernel and prevent timeout during tests.
no-build-isolation-package = [
    "box2d-py",
    "deepspeed"
]

# Overrides replace upstream transitive pins.
override-dependencies = [
    # torch 2.11.0's cu13 wheel pins nvidia-nccl-cu13==2.28.9 in its metadata,
    # but its binary actually references ncclDevCommDestroy, which was only
    # added in NCCL 2.30. Following torch's pin gets you an undefined-symbol
    # ImportError on first `import torch`. Override the pin to >=2.30.
    # Linux-only: nvidia-nccl-cu13 has no wheels for macOS/Windows, so an
    # unmarked override forces the resolver to try installing it everywhere
    # and breaks non-Linux CI.
    "nvidia-nccl-cu13>=2.30; sys_platform == 'linux'",
]

[tool.hatch.build.targets.wheel]
packages = ["agilerl"]
exclude = ["agilerl/arena"]

[tool.hatch.build.targets.sdist]
include = ["agilerl", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["agilerl-arena", "agilerl/arena"]

# ---------------------------------------------------------------------------
# ty — static type checking (run with `just typecheck`)
# ---------------------------------------------------------------------------
# Strict: the whole of agilerl/ is checked and blocks CI. `agilerl/arena` is the
# gitignored dev symlink into agilerl-arena/agilerl/arena; `just typecheck`
# creates it and passes both paths explicitly (ty does not traverse symlinked
# directories during discovery).

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["agilerl", "agilerl/arena"]

# Imports that only resolve on some platforms/extras: vllm, deepspeed and
# liger_kernel are Linux-only; Box2D needs the box2d extra. CI (Linux,
# --extra all) resolves them; macOS/Windows checkouts cannot.
[[tool.ty.overrides]]
include = [
    "agilerl/algorithms/core/base.py",
    "agilerl/algorithms/core/llm_ops/fused_loss.py",
    "agilerl/algorithms/grpo.py",
    "agilerl/algorithms/sft.py",
    "agilerl/utils/llm_utils.py",
    "agilerl/utils/utils.py",
]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
# Suppressions these files need on Linux (where vllm/liger/deepspeed resolve
# and their base classes become checkable) are necessarily unused elsewhere.
unused-ignore-comment = "ignore"

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["tests/assets/tiny_llm", "docs/_static/examples"]

[tool.ruff.lint.isort]
# Pin first-party classification: `agilerl` is our own package in both
# distributions. Without this, isort infers it from the filesystem and the
# gitignored agilerl/arena dev symlink (created by `just typecheck`) flips
# arena imports between first- and third-party, so local runs and
# pre-commit.ci would reorder each other's imports indefinitely.
known-first-party = ["agilerl"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",          # Line length (handled by formatter)
    "FIX", "TD",     # All FIXME and TODO rules
    "D203", "D213",  # Specific docstring conflicts
    "D100", "D107",  # Missing docstrings (module/init)
    "ARG",           # All unused argument rules (ARG002, 004, etc.)
    "FBT",           # All boolean trap rules (FBT001, 002, 003)
    "PLR09",         # All "Too Many..." complexity rules (branches, args, returns)
    "C901",          # complexity
    "N812",          # import lowercase as upper
    "UP007",         # union operator
    "S101",          # use of asserts outside tests
    "T201",          # print statements used in training loops (for now)
    "DTZ005",        # datetime.now() without tz argument
    "COM812",        # issues with ruff-format
    "PYI024",        # namedtuple issue
]

[tool.ruff.lint.flake8-annotations]
# `Any` is banned in annotations (ANN401), except for genuinely variadic
# ``*args`` / ``**kwargs`` where a precise type isn't expressible.
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"{agilerl,agilerl-arena/agilerl,tests,agilerl-arena/tests}/**" = [
    "D1",            # missing docstrings in public modules/classes/methods/packages
    "D205",          # 1 blank line between summary and description
    "D4",            # first line punctuation/period (conflicts with multi-line)
    "N8",            # naming: math (L, T, H), public API (BC_LM), and casing
    "S",             # security: pickle (checkpoints), random (non-crypto), asserts
    "PTH",           # path/os compatibility: os.remove, isdir, open
    "TRY", "BLE",    # exception handling: TypeError, abstract raises, catching Exception
    "PLR", "PLW", "PLC", # pylint: magic values, registry/config __hash__, self-assignment, loops
    "SIM",           # simplification: nested if, contextlib.suppress
    "ARG001",        # unused args (interface consistency)
    "ERA001",        # commented-out code (kept for reference)
    "SLF001",        # private member access (torch/accelerate internals)
    "NPY002",        # legacy np.random
    "TC001", "TC002", "TC003",# type-checking block imports
    "A002",          # argument shadowing builtin (input)
    "PIE790",        # unnecessary ...
    "PD011",         # .values -> .to_numpy()
]
"{tests,agilerl-arena/tests}/**" = [
    "ANN",           # test signatures don't need annotations
]
"{benchmarking,demos,tutorials}/**" = ["ALL"]
".github/**" = [
    "INP001",        # standalone CI scripts, not a package
]
"scripts/**" = [
    "INP001",        # standalone scripts, not a package
]
