[project]
name = "agilerl"
dynamic = ["version"]
description = "Train and deploy specialized agents on Arena, AgileRL's post-training platform, from your terminal."
authors = [{ name = "AgileRL", email = "dev@agilerl.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<3.14"
keywords = ["reinforcement learning", "llm", "rlhf", "arena", "agilerl"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.3.0",
    "cryptography>=42",
    "lazy-loader>=0.4",
    "httpx>=0.27,<1",
    "packaging>=20.0",
    "pydantic>=2.0,<3",
    "python-keycloak>=4.0,<8",
    "pyyaml>=6.0",
    "rich>=13.0,<16",
    # Imported directly (typing_extensions.Self); do not rely on pydantic's
    # transitive pin.
    "typing-extensions>=4.4",
]

[project.urls]
Homepage = "https://agilerl.com"
Documentation = "https://docs.arena.agilerl.com/"
Repository = "https://github.com/AgileRL/AgileRL"
Issues = "https://github.com/AgileRL/AgileRL/issues"

[project.optional-dependencies]
# Snowpark requires protobuf<6.34 and vLLM 0.32 pins protobuf==7.36.1 on s390x.
snowflake = [
    "snowflake-connector-python>=4.8,<4.9; platform_machine != 's390x'",
    "snowflake-snowpark-python; platform_machine != 's390x'",
]
# Model Registry calls and the parquet export run inside the Snowflake job.
snowflake-job = [
    "agilerl[snowflake]; platform_machine != 's390x'",
    "pyarrow; platform_machine != 's390x'",
    "snowflake-ml-python>=2.8.0; platform_machine != 's390x'",
]

[project.scripts]
arena = "agilerl.cli:main"

[dependency-groups]
# test_snowflake_publish_job builds a tiny transformers model with torch.
dev = [
    "jsonschema>=4",
    # test_reward_check runs reward files that import numpy.
    "numpy>=2.0.0,<3.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.2.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.5",
    "torch>=2.13.0",
    "transformers>=5.16.1",
]

[tool.uv.workspace]
members = []

[tool.uv.sources]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
search_parent_directories = true
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
# Hub tags are agilerl/vX.Y.Z; the public repo tags vX.Y.Z.
tag_regex = "^(?:agilerl/)?v(?P<version>\\d+\\.\\d+\\.\\d+)$"
git_describe_command = [
    "git",
    "describe",
    "--tags",
    "--abbrev=0",
    "--match",
    "agilerl/v*",
    "--match",
    "v[0-9]*",
]

[tool.hatch.build.targets.wheel]
only-include = ["agilerl"]

[tool.hatch.build.targets.sdist]
only-include = ["agilerl", "README.md"]

[tool.pytest.ini_options]
addopts = [
    "-n", "logical",
    "--dist", "loadgroup",
    "--durations=0",
    "--durations-min=1.0",
]
env = [
    "PYTHONHASHSEED=0",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["agilerl"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",          # Line length (handled by formatter)
    "FIX", "TD",     # All FIXME and TODO rules
    "D203", "D213",  # Specific docstring conflicts
    "D100", "D107",  # Missing docstrings (module/init)
    "ARG",           # All unused argument rules (ARG002, 004, etc.)
    "FBT",           # All boolean trap rules (FBT001, 002, 003)
    "PLR09",         # All "Too Many..." complexity rules (branches, args, returns)
    "C901",          # complexity
    "N812",          # import lowercase as upper
    "UP007",         # union operator
    "S101",          # use of asserts outside tests
    "T201",          # print statements used in training loops (for now)
    "DTZ005",        # datetime.now() without tz argument
    "COM812",        # issues with ruff-format
    "PYI024",        # namedtuple issue
]

[tool.ruff.lint.flake8-annotations]
# `Any` is banned in annotations (ANN401), except for genuinely variadic
# ``*args`` / ``**kwargs`` where a precise type isn't expressible.
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"{agilerl,tests}/**" = [
    "D1",            # missing docstrings in public modules/classes/methods/packages
    "D205",          # 1 blank line between summary and description
    "D4",            # first line punctuation/period (conflicts with multi-line)
    "N8",            # naming: math (L, T, H), public API (BC_LM), and casing
    "S",             # security: pickle (checkpoints), random (non-crypto), asserts
    "PTH",           # path/os compatibility: os.remove, isdir, open
    "TRY", "BLE",    # exception handling: TypeError, abstract raises, catching Exception
    "PLR", "PLW", "PLC", # pylint: magic values, registry/config __hash__, self-assignment, loops
    "SIM",           # simplification: nested if, contextlib.suppress
    "ARG001",        # unused args (interface consistency)
    "ERA001",        # commented-out code (kept for reference)
    "SLF001",        # private member access (torch/accelerate internals)
    "NPY002",        # legacy np.random
    "TC001", "TC002", "TC003",# type-checking block imports
    "A002",          # argument shadowing builtin (input)
    "PIE790",        # unnecessary ...
    "PD011",         # .values -> .to_numpy()
]
"tests/**" = [
    "ANN",           # test signatures don't need annotations
]
"scripts/*.py" = ["ALL"]
".github/**" = [
    "INP001",        # standalone CI scripts, not a package
]
"snowflake_app/**" = [
    "S608",          # SQL values pass through setup_sql.string_literal
]
"scripts/**" = [
    "INP001",        # standalone scripts, not a package
    "S603",          # argv lists for aws/git are built in-process
    "S607",          # those CLIs are resolved on PATH
]
