---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# Vendored binary test fixtures; opaque to every hook here.
exclude: ^tests/assets/tiny_llm/
ci:
    autofix_prs: true
    autofix_commit_msg: '[pre-commit.ci] auto fixes from pre-commit hooks'
    autoupdate_branch: nightly
    # ty needs the project venv for import resolution; pre-commit.ci has none.
    skip: [codeql-python, ty]
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-symlinks
          - id: destroyed-symlinks
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-toml
          - id: check-ast
          - id: check-added-large-files
            args: [--maxkb=10000]
          - id: check-merge-conflict
          - id: check-executables-have-shebangs
          - id: check-shebang-scripts-are-executable
          - id: detect-private-key
          - id: debug-statements
          - id: mixed-line-ending
            args: [--fix=lf]
    - repo: https://github.com/codespell-project/codespell
      rev: v2.4.3
      hooks:
          - id: codespell
            args:
                - --skip=*.css,*.js,*.map,*.scss,*.svg
                - --ignore-words-list=magent,pres,roate
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.22
      hooks:
          - id: ruff-check
            name: Ruff Linter
            args: [--fix]
          - id: ruff-format
            name: Ruff Formatter

    - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
      rev: 0.2.3
      hooks:
          - id: yamlfmt

    - repo: https://github.com/astral-sh/uv-pre-commit
      # uv version.
      rev: 0.11.29
      hooks:
          - id: uv-lock

    # agilerl.arena is a namespace portion shipped by agilerl-arena; ty resolves
    # it through this dev symlink, which is gitignored so fresh clones lack it.
    # Must run before the ty hook below.
    - repo: local
      hooks:
          - id: arena-symlink
            name: Create the agilerl/arena dev symlink
            entry: bash -c '[ -e agilerl/arena ] || ln -s ../agilerl-arena/agilerl/arena agilerl/arena'
            language: system
            pass_filenames: false
            always_run: true

    # ty is not a project dependency; `uv run --with` overlays the pinned
    # version onto the synced project environment, which it needs in order to
    # resolve third-party imports. This entry is the single home for that
    # version: the type-checks CI workflow runs this same hook.
    #
    # Checked at both ends of `requires-python`. The floor catches use of APIs
    # newer than 3.10; only the ceiling resolves tensordict's types concretely
    # rather than as the gradual `Unknown`, which — being assignable to
    # anything — silently swallows checks at the floor. Each pass takes ~4s, so
    # the local loop can afford to match CI.
    #
    # The stock astral-sh/ty-pre-commit hook cannot be used here: it shells out
    # to `uv check`, which has no passthrough for ty's `--python-version`.
    - repo: local
      hooks:
          - id: ty
            name: ty (static type checking, 3.10 + 3.13)
            entry: bash -c 'status=0; for v in 3.10 3.13; do uv run --with ty==0.0.61 ty check agilerl agilerl/arena --python-version "$v" || status=1;
                done; exit $status'
            language: system
            pass_filenames: false
            files: ^(agilerl|agilerl-arena)/.*\.py$|^pyproject\.toml$

    - repo: local
      hooks:
          - id: codeql-python
            name: CodeQL Python Security & Quality (manual)
            entry: python .github/codeql/run_codeql.py
            language: system
            pass_filenames: false
            always_run: true
            stages: [manual]
