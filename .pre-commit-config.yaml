---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# Vendored binary test fixtures; opaque to every hook here.
exclude: ^tests/assets/tiny_llm/
ci:
    autofix_prs: true
    autofix_commit_msg: '[pre-commit.ci] auto fixes from pre-commit hooks'
    autoupdate_branch: nightly
    # ty needs the project venv for import resolution; pre-commit.ci has none.
    skip: [codeql-python, ty]
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-symlinks
          - id: destroyed-symlinks
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-toml
          - id: check-ast
          - id: check-added-large-files
            args: [--maxkb=10000]
          - id: check-merge-conflict
          - id: check-executables-have-shebangs
          - id: check-shebang-scripts-are-executable
          - id: detect-private-key
          - id: debug-statements
          - id: mixed-line-ending
            args: [--fix=lf]
    - repo: https://github.com/codespell-project/codespell
      rev: v2.4.3
      hooks:
          - id: codespell
            args:
                - --skip=*.css,*.js,*.map,*.scss,*.svg
                - --ignore-words-list=magent,pres,roate
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.1
      hooks:
          - id: ruff-check
            name: Ruff Linter
            args: [--fix]
          - id: ruff-format
            name: Ruff Formatter

    - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
      rev: 0.2.3
      hooks:
          - id: yamlfmt

    - repo: https://github.com/astral-sh/uv-pre-commit
      # uv version.
      rev: 0.12.1
      hooks:
          - id: uv-lock

    - repo: local
      hooks:
          - id: arena-symlink
            name: Create the agilerl/arena dev symlink
            entry: bash -c '[ -e agilerl/arena ] || ln -s ../agilerl-arena/agilerl/arena agilerl/arena'
            language: system
            pass_filenames: false
            always_run: true
          - id: check-extras
            name: Check the arena pin and that the all extra unions every extra
            entry: python scripts/check-extras.py
            language: python
            additional_dependencies: [tomli; python_version < '3.11']
            pass_filenames: false
            files: ^(pyproject\.toml|agilerl-arena/pyproject\.toml|scripts/check-extras\.py)$

    - repo: https://github.com/astral-sh/ty-pre-commit
      rev: v0.0.65
      hooks:
          - id: ty

    - repo: local
      hooks:
          - id: codeql-python
            name: CodeQL Python Security & Quality (manual)
            entry: python .github/codeql/run_codeql.py
            language: system
            pass_filenames: false
            always_run: true
            stages: [manual]
