---
# PPO hyperparameters tuned for Gymnasium MuJoCo Walker2d (continuous control).
# Aligned with common MuJoCo PPO practice (e.g. CleanRL / SB3 defaults).

algorithm:
    name: PPO
    batch_size: 128
    lr: 0.00007
    learn_step: 2048
    gamma: 0.99
    gae_lambda: 0.97
    action_std_init: 1.0
    clip_coef: 0.165
    ent_coef: 0.00000065
    vf_coef: 0.26
    max_grad_norm: 0.6
    target_kl:
    update_epochs: 8
    share_encoders: false

environment:
    name: Walker2d-v5
    num_envs: 16
    sync: true

mutation:
    probabilities:
        no_mut: 1.0
        arch_mut: 0.0
        new_layer: 0.0
        params_mut: 0.0
        act_mut: 0.0
        rl_hp_mut: 0.0
    rl_hp_selection:
        lr:
            min: 0.0001
            max: 0.001
        batch_size:
            min: 32
            max: 256
        learn_step:
            min: 1024
            max: 8192
        ent_coef:
            min: 0.0
            max: 0.01
        update_epochs:
            min: 4
            max: 15
    mutation_sd: 0.1
    rand_seed: 42

network:
    latent_dim: 256
    max_latent_dim: 512
    arch: mlp
    encoder_config:
        hidden_size:
            - 64
        activation: ReLU
        min_mlp_nodes: 64
        max_mlp_nodes: 512
        layer_norm: true

    head_config:
        hidden_size:
            - 64
        activation: ReLU
        min_hidden_layers: 1
        max_hidden_layers: 3
        min_mlp_nodes: 64
        max_mlp_nodes: 512
        output_vanish: true
        layer_norm: true

tournament_selection:
    tournament_size: 2
    elitism: true

training:
    max_steps: 3_000_000
    target_score: 4000.0
    pop_size: 1
    evo_steps: 20_480
    eval_steps: 1000
    eval_loop: 1
