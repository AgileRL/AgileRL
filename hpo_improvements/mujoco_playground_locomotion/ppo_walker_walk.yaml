---

algorithm:
    name: PPO
    batch_size: 256
    lr: 0.0002
    learn_step: 4096
    gamma: 0.99
    gae_lambda: 0.95
    action_std_init: 0.8
    clip_coef: 0.2
    ent_coef: 0.005
    vf_coef: 0.5
    max_grad_norm: 0.5
    target_kl:
    update_epochs: 8
    share_encoders: true

environment:
    name: WalkerWalk
    num_envs: 16

mutation:
    probabilities:
        no_mut: 0.4
        arch_mut: 0.2
        new_layer: 0.2
        params_mut: 0.2
        act_mut: 0.0
        rl_hp_mut: 0.2
    rl_hp_selection:
        lr:
            min: 0.0001
            max: 0.01
        batch_size:
            min: 8
            max: 1024
        learn_step:
            min: 256
            max: 8192
        ent_coef:
            min: 0.001
            max: 0.1
        update_epochs:
            min: 1
            max: 10
    mutation_sd: 0.1
    rand_seed: 42

network:
    latent_dim: 256
    max_latent_dim: 256
    arch: mlp
    encoder_config:
        hidden_size:
            - 256
            - 256
        activation: Tanh
        min_mlp_nodes: 64
        max_mlp_nodes: 500
        layer_norm: false

    head_config:
        hidden_size:
            - 256
            - 256
        activation: Tanh
        min_hidden_layers: 1
        max_hidden_layers: 3
        min_mlp_nodes: 64
        max_mlp_nodes: 500
        output_vanish: true
        layer_norm: false

tournament_selection:
    tournament_size: 2
    elitism: true

training:
    max_steps: 2_000_000
    target_score:
    pop_size: 4
    evo_steps: 160_000
    eval_steps:
    eval_loop: 3
