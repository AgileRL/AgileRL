---
# PPO on EnvPool MuJoCo Playground PandaRobotiqPushCube-v1
#
# Observation: 48-dim flat vector  |  Action: 7-dim continuous Box(-1, 1)
# Episode length: 3000 steps

algorithm:
    name: PPO
    batch_size: 512
    lr: 0.0001
    learn_step: 4800
    gamma: 0.994
    gae_lambda: 0.95
    action_std_init: 0.5
    clip_coef: 0.15
    ent_coef: 0.005
    vf_coef: 0.5
    max_grad_norm: 0.5
    target_kl: 0.01
    update_epochs: 4
    share_encoders: false

environment:
    name: PandaRobotiqPushCube-v1
    num_envs: 16
    config:
        env_id: PandaRobotiqPushCube-v1
        env_kwargs:
            flatten_obs: true

network:
    latent_dim: 128
    max_latent_dim: 512
    arch: mlp
    encoder_config:
        hidden_size:
            - 256
            - 256
        activation: Sigmoid
        min_mlp_nodes: 64
        max_mlp_nodes: 512
    head_config:
        hidden_size:
            - 128
        activation: Sigmoid
        min_mlp_nodes: 64
        max_mlp_nodes: 512
        output_vanish: true

mutation:
    probabilities:
        no_mut: 0.4
        arch_mut: 0.2
        new_layer: 0.2
        params_mut: 0.2
        act_mut: 0.0
        rl_hp_mut: 0.2
    rl_hp_selection:
        lr:
            min: 0.00005
            max: 0.001
        batch_size:
            min: 512
            max: 8192
        learn_step:
            min: 4096
            max: 65536
        ent_coef:
            min: 0.0
            max: 0.01
        update_epochs:
            min: 2
            max: 10
    mutation_sd: 0.1
    rand_seed: 42

tournament_selection:
    tournament_size: 2
    elitism: true

training:
    max_steps: 50_000_000
    pop_size: 4
    evo_steps: 960_000
    eval_steps:
    eval_loop: 8
