---
# PPO on EnvPool MuJoCo Playground PandaRobotiqPushCube-v1
#
# Observation: 48-dim flat vector  |  Action: 7-dim continuous Box(-1, 1)
# Episode length: 3000 steps

algorithm:
    name: PPO
    batch_size: 512
    lr: 0.0003
    learn_step: 4096
    gamma: 0.994
    gae_lambda: 0.95
    action_std_init: 0.5
    clip_coef: 0.15
    ent_coef: 0.001
    vf_coef: 1.0
    max_grad_norm: 0.5
    target_kl: 0.01
    update_epochs: 8
    share_encoders: false

environment:
    name: PandaRobotiqPushCube-v1
    num_envs: 32
    config:
        env_id: PandaRobotiqPushCube-v1
        env_kwargs:
            flatten_obs: true

network:
    latent_dim: 128
    max_latent_dim: 512
    arch: mlp
    encoder_config:
        hidden_size:
            - 256
            - 256
        activation: Tanh
        min_mlp_nodes: 64
        max_mlp_nodes: 512
    head_config:
        hidden_size:
            - 128
        activation: Tanh
        min_mlp_nodes: 64
        max_mlp_nodes: 512
        output_vanish: true

training:
    max_steps: 2_000_000_000
    pop_size: 1
    evo_steps: 160_000
    eval_steps:
    eval_loop: 3
