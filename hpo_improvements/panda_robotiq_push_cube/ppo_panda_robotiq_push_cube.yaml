---
# PPO on EnvPool MuJoCo Playground PandaRobotiqPushCube-v1
#
# Observation: 48-dim flat vector  |  Action: 7-dim continuous Box(-1, 1)
# Episode length: 3000 steps

algorithm:
    name: PPO
    batch_size: 512
    lr: 0.0006
    learn_step: 4096
    gamma: 0.994
    gae_lambda: 0.95
    action_std_init: 0.5
    clip_coef: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
    target_kl:
    update_epochs: 8
    share_encoders: false

environment:
    name: PandaRobotiqPushCube-v1
    num_envs: 16
    config:
        env_id: PandaRobotiqPushCube-v1
        env_kwargs:
            flatten_obs: true

network:
    latent_dim: 64
    max_latent_dim: 256
    arch: mlp
    encoder_config:
        hidden_size:
            - 64
            - 64
        activation: Tanh
        min_mlp_nodes: 32
        max_mlp_nodes: 256
    head_config:
        hidden_size:
            - 64
        activation: Tanh
        min_mlp_nodes: 32
        max_mlp_nodes: 256
        output_vanish: true

training:
    max_steps: 2_000_000_000
    pop_size: 1
    evo_steps: 160_000
    eval_steps:
    eval_loop: 3
