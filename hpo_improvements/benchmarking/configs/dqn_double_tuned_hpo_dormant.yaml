---
# Parameter-operator DORMANCY PROBE -- baseline arm (ORIGINAL Gaussian parameter
# mutation, param_mut_type: original). ReLU activations, activation mutation forced
# OFF. Paired with the matching *_reborn.yaml / *_regrama.yaml, which differ ONLY in
# the parameter operator, so the gap in eval/best_dormant_fraction between the arms
# is attributable to that operator alone.
#
# SINGLE-AGENT PROBE (pop_size = 1): unlike the population runs, this config exists
# to measure the *dormancy* effect of the parameter operator, not to search. With one
# agent there is no selection pressure at all -- tournament selection trivially
# re-clones the same agent every evolution step -- so nothing can filter out a bad
# mutation, and the dormant-neuron trace reflects the raw operator applied on top of
# training. The trade-off is that fitness from this run is NOT a fair read on the
# operator's performance (a population run is); read the dormancy curve, not the
# score.
#
# TUNED Double DQN on the Atari 2600 suite. The base hyperparameters, the Mnih et al.
# (2015) -> AgileRL mapping, and the tuned Double DQN deltas from van Hasselt, Guez &
# Silver (2016) are all unchanged -- see dqn_double_tuned_no_hpo.yaml for the full
# derivation (epsilon decay, tau = 1/30000, reward clipping, replay-buffer sizing,
# etc.), EXCEPT that the training budget is cut to a SHORT PROBE: max_steps = 100,000
# per-agent steps with an evolution event every 5,000, i.e. ~20 parameter mutations,
# just enough to see the dormancy trace separate between the arms. This is far too
# short to learn Pong -- treat the run as a dormancy measurement, never as a
# performance result. See the eps_decay note at the bottom.
#
# Isolation ablation vs the full HPO regime:
#   pop_size = 1 -- one agent, so tournament_selection below is structurally INERT
#   ONLY the parameter mutation is active, and at probability 1.0: the agent gets a
#     parameter mutation at EVERY evolution step (no `no mutation` draws), which is
#     what makes the dormancy trace a clean read on the operator
#   arch / new_layer / act / rl_hp mutations are all OFF
#   rl_hp_selection below is retained for provenance but INERT (rl_hp_mut = 0.0)
#   network min/max bounds are likewise inert (arch mutations OFF -- shape fixed)
#   dqn_double_tuned_no_hpo.yaml (one agent, no mutation at all) is the natural
#     mutation-free control for both arms

algorithm:
    name: DQN
    batch_size: 32
    lr: 0.00025
    learn_step: 4
    gamma: 0.99
    tau: 3.3333333333333334e-05  # target network update freq 30,000 -> Polyak tau = 1/30000
    double: true
    # DELIBERATELY false, matching dqn_double_tuned_reborn.yaml (the other
    # dqn_double_tuned_*.yaml keep it true). That config must disable CUDA graphs
    # so ReBorn's GraMa backward hooks fire; this is its isolation baseline, so it
    # has to run under the same compilation regime or the comparison would confound
    # the parameter operator with a CUDA-graph difference. See the longer note in
    # dqn_double_tuned_reborn.yaml.
    cudagraphs: false

environment:
    name: Pong-v5
    num_envs: 16

mutation:
    # no_mut is the relative weight of "leave this agent unchanged"; the remaining
    # five are the relative weights of each mutation kind (renormalised internally).
    # DORMANCY PROBE: every operator except the parameter mutation is OFF, and
    # no_mut is 0.0 so the single agent receives a parameter mutation at EVERY
    # evolution step. With only one agent, a non-zero no_mut would just blank out a
    # random half of the evolution steps and blur the dormancy trace; the
    # training-only control lives in a separate run (dqn_double_tuned_no_hpo.yaml)
    # rather than in the same population.
    probabilities:
        no_mut: 0.0      # OFF -- the agent is mutated every evolution step (see above)
        arch_mut: 0.0    # OFF -- isolate the parameter operator (network shape fixed)
        new_layer: 0.0   # OFF -- conditional within arch_mut, now inert
        params_mut: 1.0  # the ONLY operator: Gaussian (original) weight noise, strength = mutation_sd
        act_mut: 0.0     # OFF -- ReLU kept throughout so the dormant-neuron phenomenon (and ReBorn) stays visible
        rl_hp_mut: 0.0   # OFF -- NB: no hyperparameter search happens under this ablation
    rl_hp_selection:
        # INERT under this ablation (rl_hp_mut = 0.0): nothing here is mutated -- every
        # agent keeps the base values from the `algorithm` block. Kept for provenance
        # with the full HPO regime and to satisfy manifest validation.
        # The highest-leverage, well-behaved DQN hyperparameters (lr, batch_size,
        # learn_step), each centred on this config's tuned base value. grow/shrink
        # factors are the multiplicative step taken per mutation (value *=
        # grow_factor or *= shrink_factor, clipped to [min, max]); they are widened
        # or narrowed per hyperparameter according to how sensitive training is to
        # that knob. gamma and tau are intentionally excluded -- see the note after
        # learn_step.
        lr:
            # Optimisation step size -- the single most impactful knob. Base
            # 0.00025; explore ~5e-5 .. 1e-3 with the standard coarse factors.
            min: 0.00005
            max: 0.001
            grow_factor: 1.2
            shrink_factor: 0.8
        batch_size:
            # Base 32; 16 .. 256. Coarse factors are fine for a power-of-two-ish knob.
            min: 16
            max: 256
            grow_factor: 1.2
            shrink_factor: 0.8
        learn_step:
            # Update frequency (gradient step every learn_step env steps). Base 4;
            # 1 .. 16. Coarse factors.
            min: 1
            max: 16
            grow_factor: 1.2
            shrink_factor: 0.8
        # gamma and tau are deliberately NOT mutated.
        #
        # gamma: the impactful quantity is the effective horizon H = 1/(1 - gamma),
        # not gamma itself, but the registry mutates gamma multiplicatively. Even
        # "gentle" 1.005/0.995 factors map to a coarse ~x2 / ~x0.67 swing in H per
        # mutation (0.99 -> ~0.995 doubles H from 100 to ~200; -> ~0.985 cuts it to
        # ~67), and the [0.9, 0.999] range spans a 100x horizon range with values
        # piling up at the clamped bounds. For DQN/Atari gamma = 0.99 is robust and
        # low-leverage, so it is left fixed at the base value above.
        #
        # tau: although target-update cadence matters, soft_update() fires once per
        # gradient step, so the effective target lag in env steps is ~ learn_step /
        # tau. With learn_step already mutated, searching tau too makes the space
        # partially redundant and confounds attribution. tau is left fixed at the
        # tuned 1/30000 base value; learn_step carries the related search.
    mutation_sd: 0.1  # std of the Gaussian weight perturbation for params_mut (typical)
    rand_seed: 42
    # MUST be true here. Mutations.mutation() forces population slot 0 -- the elite
    # carried over by tournament selection -- to `no_mutation` whenever this is false.
    # With pop_size = 1 the only agent IS slot 0, so mutate_elite: false would mean no
    # parameter mutation ever fires and the probe would silently measure plain training.
    mutate_elite: true
    param_mut_type: original  # original Gaussian parameter mutation (ReLU baseline for the ReBorn comparison)

network:
    # Nature DQN convolutional architecture (see dqn_double_tuned_no_hpo.yaml).
    # NB: under this parameter-operator isolation the architecture is FIXED (arch /
    # new_layer mutations are OFF), so the min/max bounds below are INERT -- kept
    # only to satisfy manifest validation and for provenance with the full HPO
    # regime, not as an active search space.
    latent_dim: 512
    min_latent_dim: 256    # base 512 centred in 256 .. 1024 (sqrt(256 x 1024) = 512)
    max_latent_dim: 1024
    arch: cnn
    encoder_config:
        channel_size:
            - 32
            - 64
            - 64
        kernel_size:
            - 8
            - 4
            - 3
        stride_size:
            - 4
            - 2
            - 1
        activation: ReLU       # fixed ReLU (act_mut is OFF under this ablation)
        layer_norm: false
        init_layers: true
        min_channel_size: 16   # conv channels: 16 .. 256 (base 64 layers centred;
        max_channel_size: 256  #   the first layer's base 32 sits below centre, as
                               #   a single global bound can't centre 32/64/64 at once)
    head_config:
        hidden_size:
            - 512
        activation: ReLU       # fixed ReLU (act_mut is OFF under this ablation)
        output_activation:
        layer_norm: false
        init_layers: true
        min_hidden_layers: 1   # head depth: 1 .. 3 (1 is the structural floor)
        max_hidden_layers: 3
        min_mlp_nodes: 128     # head width: base 512 centred in 128 .. 2048 (4x each way)
        max_mlp_nodes: 2048

replay_buffer:
    # 300,000 (not the paper's 1,000,000): AgileRL keeps the buffer on the
    # training device and stores full 4-frame stacks for obs and next_obs, so 1M
    # would need ~53 GiB of GPU memory. See dqn_double_tuned_no_hpo.yaml for details.
    # NOTE: this buffer is allocated per agent; with pop_size = 1 the run needs the
    # same replay memory as the single-agent no-HPO run. Kept at 300,000 so the probe
    # is directly comparable to the pop_size = 4 configs rather than being confounded
    # by a larger buffer.
    max_size: 300_000

tournament_selection:
    # Structurally INERT at pop_size = 1: elitism re-clones the sole agent into the
    # next generation every step and the tournament has nothing to choose between.
    # Kept so the manifest matches the population configs and the mutation history
    # keeps recording lineage.
    tournament_size: 2
    elitism: true

training:
    max_steps: 100_000  # SHORT PROBE budget (per-agent), not the 6.25M of the full runs
    target_score:
    pop_size: 1  # single-agent dormancy probe -- no selection pressure (see header)
    evo_steps: 5_000  # env steps between evolution events -> ~20 parameter mutations over the run
                      # NB: the trainer runs evo_steps // num_envs = 312 iterations of 16 envs,
                      # so a cycle is 4,992 steps and the run ends after 21 cycles (104,832).
    eval_steps:
    eval_loop: 1
    dormant_tau: 0.1  # tau threshold for the dormant-neuron metric (Sokar et al. 2023)
    learning_delay: 2_500  # scaled with the probe budget (was 50,000 for the 6.25M runs)
    eps_start: 1.0
    eps_end: 0.01
    # UNCHANGED from the full-length runs, and deliberately so: this schedule reaches
    # eps_end after ~1M env steps, so over a 100k probe epsilon only falls 1.0 -> ~0.63.
    # The probe therefore runs under heavy exploration throughout. That is fine for
    # comparing the two arms (both arms see the identical schedule) but it is another
    # reason the fitness of this run is meaningless. To instead finish the decay inside
    # the probe, use 0.995405 (= 0.01 ** (num_envs / 16_000)).
    eps_decay: 0.9999263199915294  # = 0.01 ** (num_envs / 1_000_000) for num_envs = 16
