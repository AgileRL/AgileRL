---
# ReBorn comparison -- DORMANT baseline (derived from dqn_double_tuned_hpo.yaml).
# Identical HPO regime but with ReLU activations, activation mutation forced
# OFF, and the ORIGINAL Gaussian parameter mutation (param_mut_type: original).
# Paired with the matching *_reborn.yaml to isolate ReBorn's effect on the
# dormant-neuron phenomenon under ReLU networks.
#
# TUNED Double DQN WITH EVOLUTIONARY SELECTION (population of 4, elitism,
# tournament) on the Atari 2600 suite -- run as a PARAMETER-OPERATOR ISOLATION:
# the ONLY active mutation is the parameter operator (original Gaussian vs ReBorn
# -- see the top comment and the `mutation` block); architecture, new-layer,
# activation and RL-hyperparameter mutations are all OFF. No HP search happens.
#
# This is the HPO counterpart of dqn_double_tuned_no_hpo.yaml. The base
# hyperparameters, the Mnih et al. (2015) -> AgileRL mapping, and the tuned
# Double DQN deltas from van Hasselt, Guez & Silver (2016) are all unchanged --
# see dqn_double_tuned_no_hpo.yaml for the full derivation (epsilon decay,
# tau = 1/30000, reward clipping, replay-buffer sizing, etc.). The `mutation` /
# `tournament_selection` blocks (and pop_size = 4) turn this into a population
# run: agents are trained, periodically given a parameter mutation, and
# re-selected by tournament.
#
# Isolation ablation vs the full HPO regime:
#   pop_size = 4, elitism = true, tournament_size = 2
#   ONLY the parameter mutation is active (params_mut); arch / new_layer / act /
#     rl_hp mutations are all OFF
#   rl_hp_selection below is retained for provenance but INERT (rl_hp_mut = 0.0)
#   network min/max bounds are likewise inert (arch mutations OFF -- shape fixed)

algorithm:
    name: DQN
    batch_size: 32
    lr: 0.00025
    learn_step: 4
    gamma: 0.99
    tau: 3.3333333333333334e-05  # target network update freq 30,000 -> Polyak tau = 1/30000
    double: true
    cudagraphs: true

environment:
    name: Pong-v5
    num_envs: 16

mutation:
    # Typical AgileRL DQN/CNN mutation probabilities, with activation mutation
    # enabled. no_mut is the relative weight of "leave this agent unchanged"; the
    # remaining five are the relative weights of each mutation kind (renormalised
    # internally). ABLATION: all operators except the parameter mutation are OFF so
    # this isolates the parameter operator (Gaussian vs ReBorn) -- 50% of agents are
    # passed through untouched (training-only control), 50% get a parameter mutation.
    probabilities:
        no_mut: 0.5      # leave unchanged: rest/consolidation + training-only control for the efficacy diagnostic
        arch_mut: 0.0    # OFF -- isolate the parameter operator (network shape fixed)
        new_layer: 0.0   # OFF -- conditional within arch_mut, now inert
        params_mut: 0.5  # the ONLY active operator: Gaussian (original) weight noise, strength = mutation_sd
        act_mut: 0.0     # OFF -- ReLU kept throughout so the dormant-neuron phenomenon (and ReBorn) stays visible
        rl_hp_mut: 0.0   # OFF -- NB: no hyperparameter search happens under this ablation
    rl_hp_selection:
        # INERT under this ablation (rl_hp_mut = 0.0): nothing here is mutated -- every
        # agent keeps the base values from the `algorithm` block. Kept for provenance
        # with the full HPO regime and to satisfy manifest validation.
        # The highest-leverage, well-behaved DQN hyperparameters (lr, batch_size,
        # learn_step), each centred on this config's tuned base value. grow/shrink
        # factors are the multiplicative step taken per mutation (value *=
        # grow_factor or *= shrink_factor, clipped to [min, max]); they are widened
        # or narrowed per hyperparameter according to how sensitive training is to
        # that knob. gamma and tau are intentionally excluded -- see the note after
        # learn_step.
        lr:
            # Optimisation step size -- the single most impactful knob. Base
            # 0.00025; explore ~5e-5 .. 1e-3 with the standard coarse factors.
            min: 0.00005
            max: 0.001
            grow_factor: 1.2
            shrink_factor: 0.8
        batch_size:
            # Base 32; 16 .. 256. Coarse factors are fine for a power-of-two-ish knob.
            min: 16
            max: 256
            grow_factor: 1.2
            shrink_factor: 0.8
        learn_step:
            # Update frequency (gradient step every learn_step env steps). Base 4;
            # 1 .. 16. Coarse factors.
            min: 1
            max: 16
            grow_factor: 1.2
            shrink_factor: 0.8
        # gamma and tau are deliberately NOT mutated.
        #
        # gamma: the impactful quantity is the effective horizon H = 1/(1 - gamma),
        # not gamma itself, but the registry mutates gamma multiplicatively. Even
        # "gentle" 1.005/0.995 factors map to a coarse ~x2 / ~x0.67 swing in H per
        # mutation (0.99 -> ~0.995 doubles H from 100 to ~200; -> ~0.985 cuts it to
        # ~67), and the [0.9, 0.999] range spans a 100x horizon range with values
        # piling up at the clamped bounds. For DQN/Atari gamma = 0.99 is robust and
        # low-leverage, so it is left fixed at the base value above.
        #
        # tau: although target-update cadence matters, soft_update() fires once per
        # gradient step, so the effective target lag in env steps is ~ learn_step /
        # tau. With learn_step already mutated, searching tau too makes the space
        # partially redundant and confounds attribution. tau is left fixed at the
        # tuned 1/30000 base value; learn_step carries the related search.
    mutation_sd: 0.1  # std of the Gaussian weight perturbation for params_mut (typical)
    rand_seed: 42
    mutate_elite: false  # keep the elite member unmutated so the best agent survives intact into the next generation
    param_mut_type: original  # original Gaussian parameter mutation (ReLU baseline for the ReBorn comparison)

network:
    # Nature DQN convolutional architecture (see dqn_double_tuned_no_hpo.yaml).
    # NB: under this parameter-operator isolation the architecture is FIXED (arch /
    # new_layer mutations are OFF), so the min/max bounds below are INERT -- kept
    # only to satisfy manifest validation and for provenance with the full HPO
    # regime, not as an active search space.
    latent_dim: 512
    min_latent_dim: 256    # base 512 centred in 256 .. 1024 (sqrt(256 x 1024) = 512)
    max_latent_dim: 1024
    arch: cnn
    encoder_config:
        channel_size:
            - 32
            - 64
            - 64
        kernel_size:
            - 8
            - 4
            - 3
        stride_size:
            - 4
            - 2
            - 1
        activation: ReLU       # fixed ReLU (act_mut is OFF under this ablation)
        layer_norm: false
        init_layers: true
        min_channel_size: 16   # conv channels: 16 .. 256 (base 64 layers centred;
        max_channel_size: 256  #   the first layer's base 32 sits below centre, as
                               #   a single global bound can't centre 32/64/64 at once)
    head_config:
        hidden_size:
            - 512
        activation: ReLU       # fixed ReLU (act_mut is OFF under this ablation)
        output_activation:
        layer_norm: false
        init_layers: true
        min_hidden_layers: 1   # head depth: 1 .. 3 (1 is the structural floor)
        max_hidden_layers: 3
        min_mlp_nodes: 128     # head width: base 512 centred in 128 .. 2048 (4x each way)
        max_mlp_nodes: 2048

replay_buffer:
    # 300,000 (not the paper's 1,000,000): AgileRL keeps the buffer on the
    # training device and stores full 4-frame stacks for obs and next_obs, so 1M
    # would need ~53 GiB of GPU memory. See dqn_double_tuned_no_hpo.yaml for details.
    # NOTE: this buffer is allocated per agent, so a population of 4 needs ~4x
    # the replay memory of the single-agent no-HPO run.
    max_size: 300_000

tournament_selection:
    tournament_size: 2
    elitism: true  # the single best agent is cloned into the next generation each step (preserved unmutated, since mutate_elite is false above)

training:
    max_steps: 6_250_000
    target_score:
    pop_size: 4
    evo_steps: 100_000  # env steps between evolution events (mutate + tournament select)
    eval_steps:
    eval_loop: 1
    dormant_tau: 0.1  # tau threshold for the dormant-neuron metric (Sokar et al. 2023)
    learning_delay: 50_000
    eps_start: 1.0
    eps_end: 0.01
    eps_decay: 0.9999263199915294  # = 0.01 ** (num_envs / 1_000_000) for num_envs = 16
