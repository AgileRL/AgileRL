---
# ReGraMa parameter mutation -- derived from dqn_double_tuned_hpo.yaml.
# ReLU activations, activation mutation forced OFF, regrama_param_mut: true with
# dormant_tau=0.1: EVERY dormant neuron (normalised GraMa score <= dormant_tau) is
# Xavier-reset before the trailing Gaussian pass. That is the dormant-neuron RESET
# variant ("Measure gradients, not activations!"). The trailing ordinary Gaussian
# noise pass (strength = mutation_sd) keeps its random-reset band but drops the
# amplified "super" band as divergence-prone. Paired with the matching
# *_hpo_dormant.yaml baseline (same config, Gaussian parameter mutation only).
#
# POPULATION ablation (pop_size = 3): this is a real run with live tournament
# selection, not a structurally-inert single-agent probe -- bad mutations can be
# filtered out, so this reads as an isolation ablation of the ReGraMa operator
# (only params_mut is active -- arch / new_layer / act / rl_hp mutations are all
# still OFF) under normal selection pressure. The baseline arm (*_hpo_dormant.yaml,
# original Gaussian) is the same config with regrama_param_mut: false, so the gap
# between the two arms' eval/best_dormant_fraction (and fitness) is attributable to
# the parameter operator alone. mutate_elite: true so the measured best agent
# always receives a ReGraMa reset rather than sometimes skating through as the
# unmutated elite.
#
# TUNED Double DQN on the Atari 2600 suite. The base hyperparameters, the Mnih et al.
# (2015) -> AgileRL mapping, and the tuned Double DQN deltas from van Hasselt, Guez &
# Silver (2016) are all unchanged -- see dqn_double_tuned_no_hpo.yaml for the full
# derivation (epsilon decay, tau = 1/30000, reward clipping, replay-buffer sizing,
# etc.), EXCEPT that the training budget is cut down: max_steps = 1,000,000
# per-agent steps with an evolution event every 100,000 (10 parameter-mutation
# cycles) -- evo_steps/learning_delay match the full dqn_double_tuned_hpo.yaml
# convention (pop 16, 6.25M steps); max_steps is cut down for a cheaper population
# run. See the eps_decay note at the bottom.
#
# Isolation ablation vs the full HPO regime:
#   ONLY the parameter mutation is active: no_mut / params_mut = 0.5 / 0.5
#   arch / new_layer / act / rl_hp mutations are all OFF
#   rl_hp_selection below is retained for provenance but INERT (rl_hp_mut = 0.0)
#   network min/max bounds are likewise inert (arch mutations OFF -- shape fixed)
#   dqn_double_tuned_no_hpo.yaml (one agent, no mutation at all) is the natural
#     mutation-free control for both arms

algorithm:
    name: DQN
    batch_size: 32
    lr: 0.00025
    learn_step: 4
    gamma: 0.99
    tau: 3.3333333333333334e-05  # target network update freq 30,000 -> Polyak tau = 1/30000
    double: true
    # DELIBERATELY false here (the other dqn_double_tuned_*.yaml keep it true).
    # ReGraMa scores neurons from GraMa, which is captured by full backward hooks
    # riding the real training backward pass (GraMaCapture). DQN wraps its whole
    # update() -- backward included -- in torch.compile + CudaGraphModule when
    # cudagraphs is set (agilerl/algorithms/dqn.py), and a replayed CUDA graph does
    # not run Python hooks registered after capture. The hooks would then never
    # fire, `_grama_scores` would stay empty, and every parameter mutation would
    # silently degrade to the Gaussian operator -- i.e. this config would not
    # measure ReGraMa at all. Kept false in the paired *_hpo_dormant.yaml baseline
    # too, so the isolation ablation compares like with like.
    cudagraphs: false

environment:
    name: Pong-v5
    num_envs: 16

mutation:
    # no_mut is the relative weight of "leave this agent unchanged"; the
    # remaining five are the relative weights of each mutation kind (renormalised
    # internally). ISOLATION ABLATION: every operator except the parameter
    # mutation is OFF, so a mutated agent always receives a ReGraMa parameter
    # mutation; no_mut is lowered to 0.25 (from the full HPO regime's 0.5) so a
    # whole generation only has a 0.25^pop_size chance of skipping the parameter
    # operator entirely -- this is a dormancy-diagnostic probe, and a generation
    # with no parameter mutation at all leaves nothing to counter dormant-neuron
    # regrowth that cycle, which shows up as an unexplained spike in
    # eval/best_dormant_fraction.
    probabilities:
        no_mut: 0.25     # a quarter of agents are left unchanged each evolution step
        arch_mut: 0.0    # OFF -- isolate the parameter operator (network shape fixed)
        new_layer: 0.0   # OFF -- conditional within arch_mut, now inert
        params_mut: 0.75 # the ONLY active mutation: ReGraMa dormant-neuron Xavier reset, then reset + ordinary Gaussian noise (mutation_sd; no amplified)
        act_mut: 0.0     # OFF -- ReLU kept throughout so the dormant-neuron phenomenon (and ReGraMa) stays visible
        rl_hp_mut: 0.0   # OFF -- NB: no hyperparameter search happens under this ablation
    rl_hp_selection:
        # INERT under this ablation (rl_hp_mut = 0.0): nothing here is mutated -- every
        # agent keeps the base values from the `algorithm` block. Kept for provenance
        # with the full HPO regime and to satisfy manifest validation.
        # The highest-leverage, well-behaved DQN hyperparameters (lr, batch_size,
        # learn_step), each centred on this config's tuned base value. grow/shrink
        # factors are the multiplicative step taken per mutation (value *=
        # grow_factor or *= shrink_factor, clipped to [min, max]); they are widened
        # or narrowed per hyperparameter according to how sensitive training is to
        # that knob. gamma and tau are intentionally excluded -- see the note after
        # learn_step.
        lr:
            # Optimisation step size -- the single most impactful knob. Base
            # 0.00025; explore ~5e-5 .. 1e-3 with the standard coarse factors.
            min: 0.00005
            max: 0.001
            grow_factor: 1.2
            shrink_factor: 0.8
        batch_size:
            # Base 32; 16 .. 256. Coarse factors are fine for a power-of-two-ish knob.
            min: 16
            max: 256
            grow_factor: 1.2
            shrink_factor: 0.8
        learn_step:
            # Update frequency (gradient step every learn_step env steps). Base 4;
            # 1 .. 16. Coarse factors.
            min: 1
            max: 16
            grow_factor: 1.2
            shrink_factor: 0.8
        # gamma and tau are deliberately NOT mutated.
        #
        # gamma: the impactful quantity is the effective horizon H = 1/(1 - gamma),
        # not gamma itself, but the registry mutates gamma multiplicatively. Even
        # "gentle" 1.005/0.995 factors map to a coarse ~x2 / ~x0.67 swing in H per
        # mutation (0.99 -> ~0.995 doubles H from 100 to ~200; -> ~0.985 cuts it to
        # ~67), and the [0.9, 0.999] range spans a 100x horizon range with values
        # piling up at the clamped bounds. For DQN/Atari gamma = 0.99 is robust and
        # low-leverage, so it is left fixed at the base value above.
        #
        # tau: although target-update cadence matters, soft_update() fires once per
        # gradient step, so the effective target lag in env steps is ~ learn_step /
        # tau. With learn_step already mutated, searching tau too makes the space
        # partially redundant and confounds attribution. tau is left fixed at the
        # tuned 1/30000 base value; learn_step carries the related search.
    mutation_sd: 0.1  # std of the ordinary Gaussian weight perturbation in the trailing pass after the resets (typical)
    rand_seed: 42
    # true (unlike the full dqn_double_tuned_hpo.yaml regime, where the elite
    # survives unmutated): this is a dormancy-diagnostic probe, so the elite must
    # also receive ReGraMa mutations or eval/best_dormant_fraction can measure an
    # agent the operator never touched.
    mutate_elite: true
    random_reset_param_mut: true      # keep the random-reset band of the trailing Gaussian pass (a selected weight is REPLACED by a fresh N(0, 1) draw)
    amplified_gauss_param_mut: false  # drop the amplified ("super") Gaussian band, which is divergence-prone; the dropped mass is NOT redistributed
    regrama_param_mut: true           # ReGraMa: Xavier-reset every dormant neuron (normalised GraMa score <= dormant_tau) before the trailing Gaussian pass
    dormant_tau: 0.01         # neuron is dormant when its normalised score <= this (the ONLY active threshold here: every such neuron is reset)

network:
    # Nature DQN convolutional architecture (see dqn_double_tuned_no_hpo.yaml).
    # NB: under this parameter-operator isolation the architecture is FIXED (arch /
    # new_layer mutations are OFF), so the min/max bounds below are INERT -- kept
    # only to satisfy manifest validation and for provenance with the full HPO
    # regime, not as an active search space.
    latent_dim: 512
    min_latent_dim: 256    # base 512 centred in 256 .. 1024 (sqrt(256 x 1024) = 512)
    max_latent_dim: 1024
    arch: cnn
    encoder_config:
        channel_size:
            - 32
            - 64
            - 64
        kernel_size:
            - 8
            - 4
            - 3
        stride_size:
            - 4
            - 2
            - 1
        activation: ReLU       # fixed ReLU (act_mut is OFF under this ablation)
        layer_norm: false
        init_layers: true
        min_channel_size: 16   # conv channels: 16 .. 256 (base 64 layers centred;
        max_channel_size: 256  #   the first layer's base 32 sits below centre, as
                               #   a single global bound can't centre 32/64/64 at once)
    head_config:
        hidden_size:
            - 512
        activation: ReLU       # fixed ReLU (act_mut is OFF under this ablation)
        output_activation:
        layer_norm: false
        init_layers: true
        min_hidden_layers: 1   # head depth: 1 .. 3 (1 is the structural floor)
        max_hidden_layers: 3
        min_mlp_nodes: 128     # head width: base 512 centred in 128 .. 2048 (4x each way)
        max_mlp_nodes: 2048

replay_buffer:
    # 300,000 (not the paper's 1,000,000): AgileRL keeps the buffer on the
    # training device and stores full 4-frame stacks for obs and next_obs, so 1M
    # would need ~53 GiB of GPU memory. See dqn_double_tuned_no_hpo.yaml for details.
    # NOTE: this buffer is allocated per agent; with pop_size = 4 the run needs ~4x
    # the replay memory of the single-agent no-HPO run.
    max_size: 300_000

tournament_selection:
    # A real tournament (pop_size = 4): agents genuinely compete each evolution
    # step, and elitism clones the best agent forward (unmutated, since
    # mutate_elite is false above).
    tournament_size: 2
    elitism: true

training:
    max_steps: 1_000_000  # cut down from the full 6.25M for a cheaper population ablation
    target_score:
    pop_size: 3
    evo_steps: 50_000  # env steps between evolution events -> 20 parameter-mutation cycles
                       # half of dqn_double_tuned_hpo.yaml's evo_steps convention (100,000)
    eval_steps:
    eval_loop: 1
    dormant_tau: 0.01  # tau threshold for the dormant-neuron metric (Sokar et al. 2023)
    learning_delay: 25_000  # half of dqn_double_tuned_hpo.yaml's full-regime value (50,000)
    eps_start: 1.0
    eps_end: 0.01
    # UNCHANGED from the full-length runs: at max_steps = 1,000,000 this schedule now
    # completes its full decay to eps_end by the end of training (unlike the earlier
    # 100k single-agent probe, where epsilon only reached ~0.63).
    eps_decay: 0.9999263199915294  # = 0.01 ** (num_envs / 1_000_000) for num_envs = 16
