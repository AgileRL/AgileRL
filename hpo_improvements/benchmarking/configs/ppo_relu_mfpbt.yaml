---
# PPO WITH MF-PBT (population of 16, multiple-frequencies population-based
# training, architecture + RL-hyperparameter mutations; activation mutations OFF)
# on Gymnasium MuJoCo.
#
# This is the MF-PBT counterpart of ppo_relu_hpo.yaml. The base hyperparameters,
# the "ReLU to the Rescue" (Jesson et al., 2024) mapping, and the 1-env -> 16-env
# CleanRL scaling (learn_step = 16 x 2048 = 32768, batch_size = 32768/32 = 1024)
# are unchanged -- see ppo_relu_no_hpo.yaml for the full derivation -- with one
# deliberate exception: ent_coef is raised from the paper's 0.0 to 0.001 so HPO can
# mutate it (the multiplicative mutation cannot move a 0.0 base off zero). The
# difference from ppo_relu_hpo.yaml is the evolution regime: the
# `tournament_selection` block is replaced by an `mf_pbt` block and `pop_size` is
# dropped (it is derived as n_subpopulations * n_individuals_per_subpopulation = 16).
# MF-PBT (Doulazmi et al.) runs subpopulations at different evolution frequencies to
# curb the greediness of single-frequency PBT while keeping fine-grained schedules.
#
# The training budget is 12M steps and the evolution interval is evo_steps = 65536
# (= 2 x the base rollout), giving many fine-grained evolution generations. The two
# subpopulations evolve at the widely-spread frequencies delta_i in {1, 5} cycles.
#
# MF-PBT additions over ppo_relu_no_hpo.yaml:
#   mf_pbt: 2 subpopulations x 8 individuals (pop_size = 16, derived),
#     evolution_frequency_ratios = [1, 5], brackets 2/0/2/4
#   activation mutations OFF (act_mut = 0.0); arch / new_layer / params / rl_hp on
#   rl_hp_selection mutates the highest-leverage, well-behaved PPO hyperparameters
#     (lr, clip_coef, update_epochs, batch_size, learn_step, ent_coef), each with
#     grow/shrink factors scaled to its sensitivity
#   network min/max bounds now actively define the architecture search space

algorithm:
    name: PPO
    batch_size: 1024
    lr: 0.0003
    learn_step: 32768
    gamma: 0.99
    gae_lambda: 0.95
    action_std_init: 0.0
    clip_coef: 0.2
    ent_coef: 0.001  # nonzero so HPO can mutate it (a 0.0 base is a multiplicative
                     # no-op); matches ppo_relu_no_hpo.yaml's base
    vf_coef: 0.5
    max_grad_norm: 0.5
    target_kl:
    update_epochs: 10
    share_encoders: false

environment:
    name: Ant-v4
    num_envs: 16

mutation:
    # Typical AgileRL MLP/MuJoCo mutation probabilities, with activation mutation
    # disabled (the paper's tanh nets are kept; no permutation among activations).
    # no_mut is the relative weight of "leave this agent unchanged"; the remaining
    # weights are the relative weights of each mutation kind (renormalised
    # internally). no_mut is set to 0.0 so that every perturbed agent -- in MF-PBT,
    # every loser-replacement clone -- is actually mutated: MF-PBT's exploit-explore
    # always perturbs a clone, and a passed-through clone would be an exact duplicate
    # of the winner it was cloned from, wasting the slot and collapsing diversity.
    probabilities:
        no_mut: 0.0      # every evolution-clone is perturbed (no exact duplicates)
        arch_mut: 0.2    # add/remove hidden nodes within the bounds below
        new_layer: 0.2   # add/remove a whole hidden layer (head) within the bounds below
        params_mut: 0.2  # Gaussian noise on weights, strength = mutation_sd
        act_mut: 0.0     # OFF -- keep tanh throughout (per the ReLU-paper PPO MuJoCo recipe)
        rl_hp_mut: 0.2   # grow/shrink one of the rl_hp_selection hyperparameters below
    rl_hp_selection:
        # The highest-leverage, well-behaved PPO hyperparameters, each centred on
        # this config's base value. grow/shrink factors are the multiplicative step
        # taken per mutation (value *= grow_factor or *= shrink_factor, clipped to
        # [min, max]); they are widened or narrowed per hyperparameter according to
        # how sensitive training is to that knob. See the note after the entries
        # for the PPO knobs that are intentionally NOT mutated.
        lr:
            # Optimisation step size -- the single most impactful knob. Base
            # 0.0003; explore ~5e-5 .. 1e-3 with the standard coarse factors.
            min: 0.00005
            max: 0.001
            grow_factor: 1.2
            shrink_factor: 0.8
        clip_coef:
            # PPO trust-region width -- the defining PPO knob, controls how far the
            # policy may move per update. Base 0.2; useful range is narrow
            # (0.1 .. 0.3), so gentler factors (~+-10% per mutation) explore it
            # finely without jumping across the whole range in one step.
            min: 0.1
            max: 0.3
            grow_factor: 1.1
            shrink_factor: 0.9
        update_epochs:
            # Number of passes over each rollout -- governs sample reuse vs
            # off-policy drift / overfitting of the clipped objective. Base 10;
            # 3 .. 20. Integer knob, coarse factors are fine.
            min: 3
            max: 20
            grow_factor: 1.2
            shrink_factor: 0.8
        batch_size:
            # MINIBATCH size (PPO slices the flattened rollout into chunks of this
            # size; num_minibatches = learn_step / batch_size), so it sets per-update
            # gradient noise. Base 1024; 256 .. 4096. Coarse factors. Kept <= the
            # smallest mutated learn_step (16384) so a minibatch never exceeds the
            # rollout buffer.
            min: 256
            max: 4096
            grow_factor: 1.2
            shrink_factor: 0.8
        learn_step:
            # Rollout-buffer size (num_envs x per-env horizon) -- controls how
            # on-policy the data is and the GAE bias/variance trade-off. Base 32768
            # (= 16 x 2048). Range deliberately bounded to 0.5x .. 2x base
            # (16384 .. 65536) so the number of update cycles an agent completes per
            # evolution step stays within ~2x across the population, keeping fitness
            # comparisons fair. Coarse factors.
            min: 16384
            max: 65536
            grow_factor: 1.2
            shrink_factor: 0.8
        ent_coef:
            # Entropy bonus -- exploration vs policy sharpening. The ReLU-paper
            # MuJoCo recipe uses 0.0, but a 0.0 base is a permanent multiplicative
            # no-op, so the base is raised to 0.001 (in the algorithm block) to make
            # this knob mutable. Base 0.001 is the geometric midpoint of 0.0001 .. 0.01
            # (sqrt(0.0001 x 0.01) = 0.001), so -- since mutation is multiplicative --
            # a mutation is equally likely to explore a smaller or larger bonus.
            # Coarse factors.
            min: 0.0001
            max: 0.01
            grow_factor: 1.2
            shrink_factor: 0.8
        # gamma, gae_lambda, vf_coef and max_grad_norm are deliberately NOT mutated:
        #
        # gamma / gae_lambda: both sit very close to 1.0, where the impactful
        # quantity is the effective horizon 1/(1 - x), not the value itself. The
        # registry mutates multiplicatively, so even gentle factors map to coarse,
        # asymmetric swings in horizon and pile up at the clamped bounds. They are
        # also read by the RolloutBuffer, which caches them at construction, so a
        # mutation on the agent attribute may not even propagate. Left fixed at the
        # robust 0.99 / 0.95 base values.
        #
        # vf_coef / max_grad_norm: low-leverage and robust at their defaults
        # (0.5 / 0.5); left fixed to keep the search budget on the knobs above.
    mutation_sd: 0.1  # std of the Gaussian weight perturbation for params_mut (typical)
    rand_seed: 42
    mutate_elite: false  # keep the elite member unmutated so the best agent survives intact into the next generation

network:
    # Paper architecture: width-64 tanh MLP. Under HPO the min/max bounds below
    # define the architecture search space that arch / new_layer mutations may
    # explore -- they are no longer just there to satisfy manifest validation.
    # The width bounds are centred on the base value (geometric centring, since
    # node counts scale multiplicatively): base 64 sits at the geometric midpoint
    # of 16 .. 256 (sqrt(16 x 256) = 64), so a mutation is equally likely to
    # explore a narrower or a wider network -- the search is unbiased, not
    # capacity-only. (Head depth is the one exception: 1 hidden layer is a hard
    # structural floor, so depth can only grow, 1 .. 3.)
    latent_dim: 64
    min_latent_dim: 16     # encoder output projection: base 64 centred in 16 .. 256
    max_latent_dim: 256
    arch: mlp
    encoder_config:
        hidden_size:
            - 64
        activation: Tanh
        output_activation: Identity
        min_mlp_nodes: 16      # encoder width: base 64 centred in 16 .. 256 nodes
        max_mlp_nodes: 256
        layer_norm: false
    head_config:
        hidden_size:
            - 64
        activation: Tanh
        min_hidden_layers: 1   # head depth: 1 .. 3 (1 is the structural floor)
        max_hidden_layers: 3
        min_mlp_nodes: 16      # head width: base 64 centred in 16 .. 256 nodes
        max_mlp_nodes: 256
        output_vanish: true
        layer_norm: false

mf_pbt:
    # Multiple-Frequencies Population-Based Training (Doulazmi et al.) replaces
    # tournament selection. 2 subpopulations of 8 agents each (pop_size = 16, derived),
    # evolving at frequencies delta_i in {1, 5} cycles. Each subpopulation is
    # ranked by fitness into 2 winners / 0 survivors / 2 open-for-migration / 4 losers; the
    # mutation block above supplies the perturbation operator for evolution-clones.
    n_subpopulations: 2
    n_individuals_per_subpopulation: 8
    evolution_frequency_ratios: [1, 5]
    n_winners: 2
    n_survivors: 0
    n_open_for_migration: 2
    n_losers: 4
    rand_seed: 42

training:
    max_steps: 12_000_000
    target_score:
    # Env steps each agent trains between evolution events. Set to 2 x the base
    # rollout (2 x 32768 = 65536), a multiple of learn_step so agents complete
    # whole collect->update cycles. Two full base PPO updates per generation keep a
    # mutation's effect (a new lr, clip_coef, architecture, ...) visible in fitness
    # rather than judged on a single noisy update, while the short interval over the
    # 12M-step budget yields many fine-grained evolution generations. With learn_step
    # bounded to 16384 .. 65536 above, every agent completes between ~1 and ~4
    # updates per generation, keeping the comparison fair.
    evo_steps: 65536
    eval_steps:
    eval_loop: 1
    dormant_tau: 0.1  # tau threshold for the dormant-neuron metric (Sokar et al. 2023)
