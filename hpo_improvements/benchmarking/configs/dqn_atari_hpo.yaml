---
# DQN with HPO (population of 4, elitism, typical mutation probabilities) on the
# Atari 2600 suite.
#
# Base hyperparameters from "Human-level control through deep reinforcement
# learning" (Mnih et al., 2015), Extended Data Table 1 -- see dqn_atari_no_hpo.yaml
# for the full paper -> AgileRL mapping and the epsilon/target-update/reward-clip
# notes (they apply identically here).
#
# HPO additions over dqn_atari_no_hpo.yaml:
#   pop_size = 4, elitism = true, tournament_size = 2
#   mutation probabilities follow common AgileRL DQN/CNN practice
#   rl_hp_selection ranges are centred on the paper's base values

algorithm:
    name: DQN
    batch_size: 32
    lr: 0.00025
    learn_step: 4
    gamma: 0.99
    tau: 0.0001  # target network update frequency 10,000 -> Polyak tau = 1/10000
    double: true
    cudagraphs: true

environment:
    name: Pong-v5
    num_envs: 8

mutation:
    probabilities:
        no_mut: 0.4
        arch_mut: 0.2
        new_layer: 0.2
        params_mut: 0.2
        act_mut: 0.2
        rl_hp_mut: 0.2
    rl_hp_selection:
        # Centred on the paper's base values (lr 0.00025, batch 32, update freq 4).
        lr:
            min: 0.00005
            max: 0.001
        batch_size:
            min: 16
            max: 256
        learn_step:
            min: 1
            max: 16
    mutation_sd: 0.1
    rand_seed: 42

network:
    # Nature DQN convolutional architecture (see dqn_atari_no_hpo.yaml). The min/max
    # bounds below define the search space architecture mutations may explore.
    latent_dim: 512
    min_latent_dim: 256
    max_latent_dim: 1024
    arch: cnn
    encoder_config:
        channel_size:
            - 32
            - 64
            - 64
        kernel_size:
            - 8
            - 4
            - 3
        stride_size:
            - 4
            - 2
            - 1
        activation: ReLU
        layer_norm: false
        init_layers: true
        min_channel_size: 32
        max_channel_size: 256
    head_config:
        hidden_size:
            - 512
        activation: ReLU
        output_activation:
        layer_norm: false
        init_layers: true
        min_hidden_layers: 1
        max_hidden_layers: 3
        min_mlp_nodes: 128
        max_mlp_nodes: 1024

replay_buffer:
    # 100,000 (not the paper's 1,000,000): AgileRL keeps the buffer on the
    # training device and stores full 4-frame stacks for obs and next_obs, so 1M
    # would need ~53 GiB of GPU memory. See dqn_atari_no_hpo.yaml for details.
    max_size: 100_000

tournament_selection:
    tournament_size: 2
    elitism: true

training:
    max_steps: 12_500_000
    target_score:
    pop_size: 4
    evo_steps: 250_000
    eval_steps:
    eval_loop: 1
    learning_delay: 50_000
    eps_start: 1.0
    eps_end: 0.1
    eps_decay: 0.99998
