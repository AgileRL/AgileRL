---
# PPO with NO HPO (single agent, never mutated).
#
# Hyperparameters from "ReLU to the Rescue: Improve Your On-Policy Actor-Critic
# with Positive Advantages" (Jesson et al., 2024), Table 3, Appendix D.1 -- the
# PPO column for Gymnasium MuJoCo (CleanRL implementation).
#
# Mapping notes (paper -> AgileRL):
#   width 64 / tanh / 2 hidden layers -> latent_dim 64, encoder [64], head [64]
#   Observation normalisation (norm. obs. in the paper) IS implemented: we wrap
#     each PPO agent in AgileRL's RSNorm wrapper in benchmark.py before training,
#     so observations are normalised to zero mean / unit variance via running
#     statistics (per "ReLU to the Rescue", Jesson et al., 2024) -- there is no
#     YAML knob for it; it is applied in code for PPO benchmarking runs.
#   The environment `name` here is a placeholder; the benchmark script overrides
#   it per selected environment.
#
# Scaling the paper's 1-env recipe to 16 parallel envs (CleanRL convention):
#   The paper uses num. envs = 1, num. steps = 2048, num. minibatch = 32. In
#   AgileRL, `learn_step` is the full rollout buffer (num_envs x per-env steps)
#   and `batch_size` is the MINIBATCH size (PPO.learn() slices the flattened
#   buffer into chunks of `batch_size`), so num. minibatches = learn_step/batch_size.
#   To keep training faithful with 16 envs we hold the two quantities that define
#   the regime constant:
#     per-env rollout horizon 2048 -> learn_step = 16 x 2048 = 32768
#       (controls GAE bias/variance and how on-policy the data is)
#     num. minibatch = 32         -> batch_size = 32768/32 = 1024
#   This is the standard CleanRL scaling (fix num_minibatches, let minibatch size
#   grow with num_envs). Note it is NOT an exact equivalence: vs 1 env we do 16x
#   fewer collect->update cycles over the same 6M-step budget, and each minibatch
#   now averages 1024 transitions (16x less gradient noise) instead of 64. The
#   only alternative is to instead fix the minibatch size (batch_size = 64,
#   giving 512 minibatches/epoch), which preserves per-update gradient noise at
#   the cost of much more compute per update; we keep the CleanRL convention.

algorithm:
    name: PPO
    batch_size: 1024
    lr: 0.0003
    learn_step: 32768
    gamma: 0.99
    gae_lambda: 0.95
    action_std_init: 0.0
    clip_coef: 0.2
    ent_coef: 0.001
    vf_coef: 0.5
    max_grad_norm: 0.5
    target_kl:
    update_epochs: 10
    share_encoders: false

environment:
    name: Ant-v4
    num_envs: 16

network:
    latent_dim: 64
    max_latent_dim: 64
    arch: mlp
    encoder_config:
        hidden_size:
            - 64
        activation: Tanh
        output_activation: Identity
        min_mlp_nodes: 64
        max_mlp_nodes: 65
        layer_norm: false
    head_config:
        hidden_size:
            - 64
        activation: Tanh
        min_hidden_layers: 1
        max_hidden_layers: 2
        min_mlp_nodes: 64
        max_mlp_nodes: 65
        output_vanish: true
        layer_norm: false

# No `mutation` or `tournament_selection` blocks => no HPO: a single agent is
# trained and never mutated or selected. Adding those blocks (with pop_size > 1)
# switches this same script into an HPO regime.

training:
    max_steps: 6_000_000
    target_score:
    pop_size: 1
    evo_steps: 163840
    eval_steps:
    eval_loop: 1
    dormant_tau: 0.1  # tau threshold for the dormant-neuron metric (Sokar et al. 2023)
