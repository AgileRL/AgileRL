---
# TUNED Double DQN WITH MF-PBT (population of 16, multiple-frequencies
# population-based training, activation + architecture + RL-hyperparameter
# mutations) on the Atari 2600 suite.
#
# This is the MF-PBT counterpart of dqn_double_tuned_hpo.yaml. The base
# hyperparameters, the Mnih et al. (2015) -> AgileRL mapping, and the tuned
# Double DQN deltas from van Hasselt, Guez & Silver (2016) are all unchanged --
# see dqn_double_tuned_no_hpo.yaml for the full derivation (epsilon decay,
# tau = 1/30000, reward clipping, replay-buffer sizing, etc.). The difference from
# dqn_double_tuned_hpo.yaml is the evolution regime: the `tournament_selection`
# block is replaced by an `mf_pbt` block and `pop_size` is dropped (it is derived as
# n_subpopulations * n_individuals_per_subpopulation = 16). The replay buffer stays
# shared across the population, exactly as in AgileRL's tournament HPO. MF-PBT
# (Doulazmi et al.) runs subpopulations at different evolution frequencies to curb
# the greediness of single-frequency PBT while keeping fine-grained schedules.
#
# The training budget is 6.25M steps and the evolution interval is evo_steps = 60_000,
# set just above the 50_000-step learning_delay so the first generation still trains
# on a learned (not random-init) policy before the first evolution; over the budget
# this gives ~104 fine-grained evolution generations. The two subpopulations evolve
# at the widely-spread frequencies delta_i in {1, 5} cycles. (DQN has no rollout
# buffer, so the PPO/IPPO "2 x base rollout" evo_steps sizing does not transfer; the
# interval is set in env-step terms against the Atari budget and warmup instead.)
#
# MF-PBT additions over dqn_double_tuned_no_hpo.yaml:
#   mf_pbt: 2 subpopulations x 8 individuals (pop_size = 16, derived),
#     evolution_frequency_ratios = [1, 5], brackets 2/0/2/4
#   activation mutations ON (act_mut = 0.2) alongside arch / params / rl_hp muts
#   rl_hp_selection mutates the highest-leverage, well-behaved DQN hyperparameters
#     (lr, batch_size, learn_step), each with grow/shrink factors scaled to its
#     sensitivity; gamma and tau are deliberately held fixed (see rl_hp_selection)
#   network min/max bounds now actively define the architecture search space

algorithm:
    name: DQN
    batch_size: 32
    lr: 0.00025
    learn_step: 4
    gamma: 0.99
    tau: 3.3333333333333334e-05  # target network update freq 30,000 -> Polyak tau = 1/30000
    double: true
    cudagraphs: true

environment:
    name: Pong-v5
    num_envs: 16

mutation:
    # Typical AgileRL DQN/CNN mutation probabilities, with activation mutation
    # enabled. no_mut is the relative weight of "leave this agent unchanged"; the
    # remaining five are the relative weights of each mutation kind (renormalised
    # internally). no_mut is set to 0.0 so that every perturbed agent -- in MF-PBT,
    # each of the 4 loser-replacement clones -- is actually mutated: MF-PBT's exploit-explore
    # always perturbs a clone, and a passed-through clone would be an exact duplicate
    # of the winner it was cloned from, wasting the slot and collapsing diversity.
    probabilities:
        no_mut: 0.0      # every evolution-clone is perturbed (no exact duplicates)
        arch_mut: 0.2    # add/remove hidden nodes/channels within the bounds below
        new_layer: 0.2   # add/remove a whole hidden layer (head) within the bounds below
        params_mut: 0.2  # Gaussian noise on weights, strength = mutation_sd
        act_mut: 0.2     # permute the activation among {ReLU, ELU, GELU} (AgileRL default set)
        rl_hp_mut: 0.2   # grow/shrink one of the rl_hp_selection hyperparameters below
    rl_hp_selection:
        # The highest-leverage, well-behaved DQN hyperparameters (lr, batch_size,
        # learn_step), each centred on this config's tuned base value. grow/shrink
        # factors are the multiplicative step taken per mutation (value *=
        # grow_factor or *= shrink_factor, clipped to [min, max]); they are widened
        # or narrowed per hyperparameter according to how sensitive training is to
        # that knob. gamma and tau are intentionally excluded -- see the note after
        # learn_step.
        lr:
            # Optimisation step size -- the single most impactful knob. Base
            # 0.00025; explore ~5e-5 .. 1e-3 with the standard coarse factors.
            min: 0.00005
            max: 0.001
            grow_factor: 1.2
            shrink_factor: 0.8
        batch_size:
            # Base 32; 16 .. 256. Coarse factors are fine for a power-of-two-ish knob.
            min: 16
            max: 256
            grow_factor: 1.2
            shrink_factor: 0.8
        learn_step:
            # Update frequency (gradient step every learn_step env steps). Base 4;
            # 1 .. 16. Coarse factors.
            min: 1
            max: 16
            grow_factor: 1.2
            shrink_factor: 0.8
        # gamma and tau are deliberately NOT mutated.
        #
        # gamma: the impactful quantity is the effective horizon H = 1/(1 - gamma),
        # not gamma itself, but the registry mutates gamma multiplicatively. Even
        # "gentle" 1.005/0.995 factors map to a coarse ~x2 / ~x0.67 swing in H per
        # mutation (0.99 -> ~0.995 doubles H from 100 to ~200; -> ~0.985 cuts it to
        # ~67), and the [0.9, 0.999] range spans a 100x horizon range with values
        # piling up at the clamped bounds. For DQN/Atari gamma = 0.99 is robust and
        # low-leverage, so it is left fixed at the base value above.
        #
        # tau: although target-update cadence matters, soft_update() fires once per
        # gradient step, so the effective target lag in env steps is ~ learn_step /
        # tau. With learn_step already mutated, searching tau too makes the space
        # partially redundant and confounds attribution. tau is left fixed at the
        # tuned 1/30000 base value; learn_step carries the related search.
    mutation_sd: 0.1  # std of the Gaussian weight perturbation for params_mut (typical)
    rand_seed: 42
    mutate_elite: false  # keep the elite member unmutated so the best agent survives intact into the next generation

network:
    # Nature DQN convolutional architecture (see dqn_double_tuned_no_hpo.yaml).
    # Under HPO the min/max bounds below define the architecture search space that
    # arch / new_layer mutations may explore -- they are no longer just there to
    # satisfy manifest validation.
    # Width bounds are centred on the base value (geometric centring, since node
    # counts scale multiplicatively), so arch mutations are equally likely to
    # explore narrower or wider nets -- the search is unbiased, not capacity-only.
    latent_dim: 512
    min_latent_dim: 256    # base 512 centred in 256 .. 1024 (sqrt(256 x 1024) = 512)
    max_latent_dim: 1024
    arch: cnn
    encoder_config:
        channel_size:
            - 32
            - 64
            - 64
        kernel_size:
            - 8
            - 4
            - 3
        stride_size:
            - 4
            - 2
            - 1
        activation: ReLU       # starting activation; act_mut permutes among {ReLU, ELU, GELU}
        layer_norm: false
        init_layers: true
        min_channel_size: 16   # conv channels: 16 .. 256 (base 64 layers centred;
        max_channel_size: 256  #   the first layer's base 32 sits below centre, as
                               #   a single global bound can't centre 32/64/64 at once)
    head_config:
        hidden_size:
            - 512
        activation: ReLU       # starting activation; act_mut permutes among {ReLU, ELU, GELU}
        output_activation:
        layer_norm: false
        init_layers: true
        min_hidden_layers: 1   # head depth: 1 .. 3 (1 is the structural floor)
        max_hidden_layers: 3
        min_mlp_nodes: 128     # head width: base 512 centred in 128 .. 2048 (4x each way)
        max_mlp_nodes: 2048

replay_buffer:
    # 300,000 (not the paper's 1,000,000): AgileRL keeps the buffer on the
    # training device and stores full 4-frame stacks for obs and next_obs, so 1M
    # would need ~53 GiB of GPU memory. See dqn_double_tuned_no_hpo.yaml for details.
    # NOTE: this buffer is allocated per agent, so a population of 16 needs ~16x
    # the replay memory of the single-agent no-HPO run.
    max_size: 300_000

mf_pbt:
    # Multiple-Frequencies Population-Based Training (Doulazmi et al.) replaces
    # tournament selection. 2 subpopulations of 8 agents each (pop_size = 16, derived),
    # evolving at frequencies delta_i in {1, 5} cycles. Each subpopulation is
    # ranked by fitness into 2 winners / 0 survivors / 2 open-for-migration / 4 losers; the
    # mutation block above supplies the perturbation operator for evolution-clones.
    n_subpopulations: 2
    n_individuals_per_subpopulation: 8
    evolution_frequency_ratios: [1, 5]
    n_winners: 2
    n_survivors: 0
    n_open_for_migration: 2
    n_losers: 4
    rand_seed: 42

training:
    max_steps: 6_250_000
    target_score:
    # Env steps each agent trains between evolution events (MF-PBT evolution +
    # migration). Set to 60_000, just above the 50_000-step learning_delay: no
    # gradient updates happen during the warmup, so a shorter interval would judge
    # the first generation on pre-learning (random-init) policies; 60_000 gives the
    # first generation ~10_000 steps of actual learning before the first evolution.
    # Short over the 6.25M-step budget (~104 generations), giving MF-PBT many
    # fine-grained generations across its two frequencies. (Unlike PPO/IPPO, DQN has
    # no rollout buffer to size this as a multiple of -- see the header note.)
    evo_steps: 60_000
    eval_steps:
    eval_loop: 1
    dormant_tau: 0.1  # tau threshold for the dormant-neuron metric (Sokar et al. 2023)
    learning_delay: 50_000
    eps_start: 1.0
    eps_end: 0.01
    eps_decay: 0.9999263199915294  # = 0.01 ** (num_envs / 1_000_000) for num_envs = 16
