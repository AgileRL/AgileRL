---
# IPPO on cooperative MPE (MPEv2) WITH evolutionary HPO (a population is mutated
# and selected each generation). Same base hyperparameters as ippo_mpe_no_hpo.yaml
# (MAPPO/MPE settings from Yu et al., 2021); see that file for the full mapping and
# rollout-sizing notes. The `mutation` + `tournament_selection` blocks below are what
# turn this into an HPO run.

algorithm:
    name: IPPO
    batch_size: 1024
    lr: 0.0007
    learn_step: 3200
    gamma: 0.99
    gae_lambda: 0.95
    action_std_init: 0.0
    clip_coef: 0.2
    ent_coef: 0.01
    vf_coef: 1.0
    max_grad_norm: 10.0
    target_kl:
    update_epochs: 10

environment:
    name: simple_spread_v3
    num_envs: 16
    entrypoint: mpe_adapter:make_mpe_parallel_env
    # `path` and `config` are filled by benchmark.run_training.

mutation:
    probabilities:
        no_mut: 0.4
        arch_mut: 0.2
        new_layer: 0.2
        params_mut: 0.2
        act_mut: 0.0
        rl_hp_mut: 0.2
    rl_hp_selection:
        # The RL hyperparameters HPO may mutate, each with a search range and the
        # coarse multiplicative grow/shrink factors applied per mutation.
        lr:
            # Optimisation step size -- the most impactful knob. Base 7e-4; explore
            # ~1e-4 .. 3e-3.
            min: 0.0001
            max: 0.003
            grow_factor: 1.2
            shrink_factor: 0.8
        clip_coef:
            # PPO trust-region width. Base 0.2; narrow useful range (0.1 .. 0.3) with
            # gentle factors.
            min: 0.1
            max: 0.3
            grow_factor: 1.1
            shrink_factor: 0.9
        learn_step:
            # Rollout-buffer size (num_envs x per-env horizon) -- controls how
            # on-policy the data is and the GAE bias/variance trade-off. Base 3200.
            # Range bounded to 0.5x .. 2x base (1600 .. 6400) so the number of
            # update cycles an agent completes per evolution step stays within ~2x
            # across the population, keeping fitness comparisons fair (same reasoning
            # as the PPO/MuJoCo config). Coarse factors.
            min: 1600
            max: 6400
            grow_factor: 1.2
            shrink_factor: 0.8
        update_epochs:
            # Passes over each rollout (sample reuse vs off-policy drift). Base 10;
            # 3 .. 20. Integer knob, coarse factors are fine.
            min: 3
            max: 20
            grow_factor: 1.2
            shrink_factor: 0.8
        batch_size:
            # MINIBATCH size (num_minibatches = learn_step/batch_size). Base 1024;
            # 256 .. 1600. The max is kept <= the smallest mutated learn_step (1600)
            # so a minibatch never exceeds the rollout buffer.
            min: 256
            max: 1600
            grow_factor: 1.2
            shrink_factor: 0.8
        # ent_coef, gamma, gae_lambda, vf_coef and max_grad_norm are left fixed:
        # ent_coef stays at the MAPPO default 0.01; gamma/gae_lambda sit near 1.0 where
        # multiplicative mutation maps to coarse horizon swings and are cached by the
        # rollout buffer at construction; vf_coef/max_grad_norm are low-leverage at
        # their MAPPO defaults (1.0 / 10.0). This keeps the search budget on the
        # high-leverage knobs above.
    mutation_sd: 0.1  # std of the Gaussian weight perturbation for params_mut
    rand_seed: 42

network:
    # Same width-64 MLP as the no-HPO config, but with min/max bounds that define the
    # architecture search space arch / new_layer / params mutations may explore. Width
    # bounds are geometrically centred on 64 (sqrt(16 x 256) = 64) so mutation is
    # equally likely to narrow or widen the network. Head depth can only grow (1 is the
    # structural floor).
    latent_dim: 64
    min_latent_dim: 16
    max_latent_dim: 256
    arch: mlp
    encoder_config:
        hidden_size:
            - 64
        activation: ReLU
        output_activation: Identity
        min_mlp_nodes: 16
        max_mlp_nodes: 256
        layer_norm: false
    head_config:
        hidden_size:
            - 64
        activation: ReLU
        min_hidden_layers: 1
        max_hidden_layers: 3
        min_mlp_nodes: 16
        max_mlp_nodes: 256
        output_vanish: true
        layer_norm: false

tournament_selection:
    tournament_size: 2
    elitism: true  # the single best agent is cloned into the next generation each step

training:
    max_steps: 5_000_000
    target_score:
    pop_size: 16
    # ~39 evolution generations over the budget (128000 = 40 x the 3200-step rollout,
    # so every agent completes whole collect->update cycles between evolution events).
    evo_steps: 128000
    eval_steps:
    eval_loop: 1
