---
# ReGraMa parameter mutation -- derived from ppo_relu_hpo.yaml.
# ReLU activations, activation mutation forced OFF, regrama_param_mut: true with
# dormant_tau=0.01: EVERY dormant neuron (normalised GraMa score <= dormant_tau) is
# Xavier-reset before the trailing Gaussian pass. That is the dormant-neuron RESET
# variant ("Measure gradients, not activations!"). The trailing ordinary Gaussian
# noise pass (strength = mutation_sd) keeps its random-reset band but drops the
# amplified "super" band as divergence-prone. Paired with the matching
# *_hpo_dormant.yaml baseline (same config, Gaussian parameter mutation only).
#
# PPO WITH EVOLUTIONARY SELECTION (population of 4, elitism, tournament) on
# Gymnasium MuJoCo -- run as a PARAMETER-OPERATOR ISOLATION: the ONLY active
# mutation is the parameter operator (original Gaussian vs ReGraMa -- see the top
# comment and the `mutation` block); architecture, new-layer, activation and
# RL-hyperparameter mutations are all OFF. No hyperparameter search happens.
#
# This is the HPO counterpart of ppo_relu_no_hpo.yaml. The base hyperparameters,
# the "ReLU to the Rescue" (Jesson et al., 2024) mapping, and the 1-env -> 16-env
# CleanRL scaling (learn_step = 16 x 2048 = 32768, batch_size = 32768/32 = 1024)
# are unchanged -- see ppo_relu_no_hpo.yaml for the full derivation -- with one
# historical exception: ent_coef is raised from the paper's 0.0 to 0.001 (it was
# made mutable in the full HPO regime; under this ablation rl_hp mutation is OFF,
# so it simply stays at 0.001). The `mutation` / `tournament_selection` blocks
# (and pop_size = 4) turn this into a population run: agents are trained,
# periodically given a parameter mutation, and re-selected by tournament.
#
# Isolation ablation vs the full HPO regime:
#   pop_size = 4, elitism = true, tournament_size = 2
#   ONLY the parameter mutation is active (params_mut); arch / new_layer / act /
#     rl_hp mutations are all OFF
#   rl_hp_selection below is retained for provenance but INERT (rl_hp_mut = 0.0)
#   network min/max bounds are likewise inert (arch mutations OFF -- shape fixed)

algorithm:
    name: PPO
    batch_size: 1024
    lr: 0.0003
    learn_step: 32768
    gamma: 0.99
    gae_lambda: 0.95
    action_std_init: 0.0
    clip_coef: 0.2
    ent_coef: 0.001  # nonzero so HPO can mutate it (a 0.0 base is a multiplicative
                     # no-op); matches ppo_relu_no_hpo.yaml's base
    vf_coef: 0.5
    max_grad_norm: 0.5
    target_kl:
    update_epochs: 10
    share_encoders: false

environment:
    name: Ant-v4
    num_envs: 16

mutation:
    # Typical AgileRL MLP/MuJoCo mutation probabilities, with activation mutation
    # disabled (the paper's ReLU nets are kept; no permutation among activations).
    # no_mut is the relative weight of "leave this agent unchanged"; the remaining
    # weights are the relative weights of each mutation kind (renormalised
    # internally). ABLATION: all operators except the parameter mutation are OFF so
    # this isolates the parameter operator (Gaussian vs ReGraMa) -- 50% of agents are
    # passed through untouched (training-only control), 50% get a parameter mutation.
    probabilities:
        no_mut: 0.5      # leave unchanged: rest/consolidation + training-only control for the efficacy diagnostic
        arch_mut: 0.0    # OFF -- isolate the parameter operator (network shape fixed)
        new_layer: 0.0   # OFF -- conditional within arch_mut, now inert
        params_mut: 0.5  # the ONLY active operator: ReGraMa dormant-neuron Xavier reset, then reset + ordinary Gaussian noise (mutation_sd; no amplified)
        act_mut: 0.0     # OFF -- ReLU kept throughout so the dormant-neuron phenomenon (and ReGraMa) stays visible
        rl_hp_mut: 0.0   # OFF -- NB: no hyperparameter search happens under this ablation
    rl_hp_selection:
        # INERT under this ablation (rl_hp_mut = 0.0): nothing here is mutated -- every
        # agent keeps the base values from the `algorithm` block. Kept for provenance
        # with the full HPO regime and to satisfy manifest validation.
        # The highest-leverage, well-behaved PPO hyperparameters, each centred on
        # this config's base value. grow/shrink factors are the multiplicative step
        # taken per mutation (value *= grow_factor or *= shrink_factor, clipped to
        # [min, max]); they are widened or narrowed per hyperparameter according to
        # how sensitive training is to that knob. See the note after the entries
        # for the PPO knobs that are intentionally NOT mutated.
        lr:
            # Optimisation step size -- the single most impactful knob. Base
            # 0.0003; explore ~5e-5 .. 1e-3 with the standard coarse factors.
            min: 0.00005
            max: 0.001
            grow_factor: 1.2
            shrink_factor: 0.8
        clip_coef:
            # PPO trust-region width -- the defining PPO knob, controls how far the
            # policy may move per update. Base 0.2; useful range is narrow
            # (0.1 .. 0.3), so gentler factors (~+-10% per mutation) explore it
            # finely without jumping across the whole range in one step.
            min: 0.1
            max: 0.3
            grow_factor: 1.1
            shrink_factor: 0.9
        update_epochs:
            # Number of passes over each rollout -- governs sample reuse vs
            # off-policy drift / overfitting of the clipped objective. Base 10;
            # 3 .. 20. Integer knob, coarse factors are fine.
            min: 3
            max: 20
            grow_factor: 1.2
            shrink_factor: 0.8
        batch_size:
            # MINIBATCH size (PPO slices the flattened rollout into chunks of this
            # size; num_minibatches = learn_step / batch_size), so it sets per-update
            # gradient noise. Base 1024; 256 .. 4096. Coarse factors. Kept <= the
            # smallest mutated learn_step (16384) so a minibatch never exceeds the
            # rollout buffer.
            min: 256
            max: 4096
            grow_factor: 1.2
            shrink_factor: 0.8
        learn_step:
            # Rollout-buffer size (num_envs x per-env horizon) -- controls how
            # on-policy the data is and the GAE bias/variance trade-off. Base 32768
            # (= 16 x 2048). Range deliberately bounded to 0.5x .. 2x base
            # (16384 .. 65536) so the number of update cycles an agent completes per
            # evolution step stays within ~2x across the population, keeping fitness
            # comparisons fair. Coarse factors.
            min: 16384
            max: 65536
            grow_factor: 1.2
            shrink_factor: 0.8
        ent_coef:
            # Entropy bonus -- exploration vs policy sharpening. The ReLU-paper
            # MuJoCo recipe uses 0.0, but a 0.0 base is a permanent multiplicative
            # no-op, so the base is raised to 0.001 (in the algorithm block) to make
            # this knob mutable. Base 0.001 is the geometric midpoint of 0.0001 .. 0.01
            # (sqrt(0.0001 x 0.01) = 0.001), so -- since mutation is multiplicative --
            # a mutation is equally likely to explore a smaller or larger bonus.
            # Coarse factors.
            min: 0.0001
            max: 0.01
            grow_factor: 1.2
            shrink_factor: 0.8
        # gamma, gae_lambda, vf_coef and max_grad_norm are deliberately NOT mutated:
        #
        # gamma / gae_lambda: both sit very close to 1.0, where the impactful
        # quantity is the effective horizon 1/(1 - x), not the value itself. The
        # registry mutates multiplicatively, so even gentle factors map to coarse,
        # asymmetric swings in horizon and pile up at the clamped bounds. They are
        # also read by the RolloutBuffer, which caches them at construction, so a
        # mutation on the agent attribute may not even propagate. Left fixed at the
        # robust 0.99 / 0.95 base values.
        #
        # vf_coef / max_grad_norm: low-leverage and robust at their defaults
        # (0.5 / 0.5); left fixed to keep the search budget on the knobs above.
    mutation_sd: 0.1  # std of the ordinary Gaussian weight perturbation in the trailing pass after the resets (typical)
    rand_seed: 42
    mutate_elite: false  # keep the elite member unmutated so the best agent survives intact into the next generation
    random_reset_param_mut: true      # keep the random-reset band of the trailing Gaussian pass (a selected weight is REPLACED by a fresh N(0, 1) draw)
    amplified_gauss_param_mut: false  # drop the amplified ("super") Gaussian band, which is divergence-prone; the dropped mass is NOT redistributed
    regrama_param_mut: true           # ReGraMa: Xavier-reset every dormant neuron (normalised GraMa score <= dormant_tau) before the trailing Gaussian pass
    dormant_tau: 0.01         # neuron is dormant when its normalised score <= this (the ONLY active threshold here: every such neuron is reset)

network:
    # Paper architecture: width-64 ReLU MLP. NB: under this parameter-operator
    # isolation the architecture is FIXED (arch / new_layer mutations are OFF), so
    # the min/max bounds below are INERT -- kept only to satisfy manifest validation
    # and for provenance with the full HPO regime, not as an active search space.
    # Every agent trains at the width-64 / single-hidden-layer base shape.
    latent_dim: 64
    min_latent_dim: 16     # encoder output projection: base 64 centred in 16 .. 256
    max_latent_dim: 256
    arch: mlp
    encoder_config:
        hidden_size:
            - 64
        activation: ReLU
        output_activation: Identity
        min_mlp_nodes: 16      # encoder width: base 64 centred in 16 .. 256 nodes
        max_mlp_nodes: 256
        layer_norm: false
    head_config:
        hidden_size:
            - 64
        activation: ReLU
        min_hidden_layers: 1   # head depth: 1 .. 3 (1 is the structural floor)
        max_hidden_layers: 3
        min_mlp_nodes: 16      # head width: base 64 centred in 16 .. 256 nodes
        max_mlp_nodes: 256
        output_vanish: true
        layer_norm: false

tournament_selection:
    tournament_size: 2
    elitism: true  # the single best agent is cloned into the next generation each step (preserved unmutated, since mutate_elite is false above)

training:
    max_steps: 6_000_000
    target_score:
    pop_size: 4
    # Env steps each agent trains between evolution events. Set to 5 x the base
    # rollout (5 x 32768 = 163840), a multiple of learn_step so agents complete
    # whole collect->update cycles. Five full PPO updates per generation is enough
    # for a parameter mutation's effect to show up in fitness rather than being
    # judged on a single noisy update, while still giving ~36 evolution generations
    # over the 6M-step budget. (learn_step is fixed at 32768 under this ablation --
    # rl_hp mutation is OFF -- so every agent completes exactly 5 updates per
    # generation.)
    evo_steps: 163840
    eval_steps:
    eval_loop: 1
    dormant_tau: 0.01  # tau threshold for the dormant-neuron metric (Sokar et al. 2023)
