---
# IPPO on cooperative MPE (MPEv2) with NO HPO (a single agent, never mutated).
#
# Hyperparameters match AgileRL's canonical multi-agent IPPO/MPE settings (the
# gentler, exploration-heavy recipe: low lr, few PPO epochs, tight gradient
# clipping, high entropy bonus). These differ from the earlier MAPPO-paper recipe
# (Yu et al., 2021); the canonical values give more stable learning here and avoid
# the premature policy over-sharpening seen with the aggressive recipe.
#
# Mapping notes:
#   lr 1e-4, gamma 0.99, GAE lambda 0.95, PPO clip 0.2, entropy coef 0.05,
#   value-loss coef 0.5, max grad norm 0.5, PPO epochs 4 -> the fields below.
#   Discrete actions (the MPE default) are produced by the adapter
#   (continuous_actions=False), so action_std_init is unused (categorical).
#   torch_compiler is deliberately omitted: torch.compile's GPU (Inductor/Triton)
#   kernels are nondeterministic across processes and bypass the cuDNN/cuBLAS
#   deterministic flags set by reproducibility.seed_everything, which made IPPO
#   runs non-reproducible at a fixed seed (verified on the cluster: compile+GPU
#   diverges; no-compile+GPU and compile+CPU are both bitwise reproducible). The
#   compile speedup is not worth losing reproducibility for the benchmark.
#
# Rollout sizing:
#   `learn_step` is the total rollout size (transitions collected before each learn);
#   the per-env horizon is learn_step/num_envs (2048/16 = 128 steps/env). `batch_size`
#   is the MINIBATCH size, so num_minibatches = learn_step/batch_size = 2048/128 = 16.
#
#   The environment `name` here is a placeholder; the benchmark script overrides it per
#   selected env and fills environment.config from registry.MPE_ENV_CONFIGS. The
#   adapter entrypoint + path make the env importable in the spawned vec-env workers.

algorithm:
    name: IPPO
    batch_size: 128
    lr: 0.0001
    learn_step: 2048
    gamma: 0.99
    gae_lambda: 0.95
    action_std_init: 0.0
    clip_coef: 0.2
    ent_coef: 0.05
    vf_coef: 0.5
    max_grad_norm: 0.5
    target_kl:
    update_epochs: 4
    # torch_compiler omitted on purpose -- see the mapping note above (reproducibility).

environment:
    name: simple_spread_v3
    num_envs: 16
    entrypoint: mpe_adapter:make_mpe_parallel_env
    # `path` and `config` are filled by benchmark.run_training (path -> this
    # benchmarking dir so the adapter imports in vec-env workers; config -> the
    # selected env's registry.MPE_ENV_CONFIGS entry).
    # NOTE: the adapter trains ONE policy PER AGENT (fully-independent IPPO) by
    # default -- AgileRL's parameter-shared grouping of homogeneous agents does not
    # learn these tasks. See mpe_adapter.make_mpe_parallel_env (separate_policies).

network:
    # Width-64, 2-layer MLP. ReLU is used suite-wide for cross-env comparability.
    latent_dim: 64
    max_latent_dim: 64
    arch: mlp
    encoder_config:
        hidden_size:
            - 64
        activation: ReLU
        output_activation: Identity
        min_mlp_nodes: 64
        max_mlp_nodes: 65
        layer_norm: false
    head_config:
        hidden_size:
            - 64
        activation: ReLU
        min_hidden_layers: 1
        max_hidden_layers: 2
        min_mlp_nodes: 64
        max_mlp_nodes: 65
        output_vanish: true
        layer_norm: false

# No `mutation` or `tournament_selection` blocks => no HPO: a single agent is
# trained and never mutated or selected. Adding those blocks (with pop_size > 1)
# switches this same script into an HPO regime (see ippo_mpe_hpo.yaml).

training:
    max_steps: 2_000_000
    target_score:
    pop_size: 1
    # Steps between evaluations. 10240 = 5 x the 2048 learn_step -> exactly 5
    # rollout->update cycles per evaluation; ~195 evaluations over the 2M budget.
    evo_steps: 10240
    eval_steps:
    eval_loop: 1
